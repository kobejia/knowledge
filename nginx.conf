server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    charset utf-8;
    root /srv/knowledge/web/personal-learning;

    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = / {
        try_files /index.html =404;
    }

    location = /personal-learning-preview.html {
        try_files /index.html =404;
    }

    location = /personal-learning-knowledge.json {
        root /srv/knowledge;
        try_files $uri =404;
    }

    location = /personal-learning-config.yaml {
        root /srv/knowledge;
        try_files $uri =404;
    }

    location = /_app/app.mjs {
        alias /srv/knowledge/web/personal-learning/app.mjs;
        default_type application/javascript;
    }

    location = /_app/model.mjs {
        alias /srv/knowledge/web/personal-learning/model.mjs;
        default_type application/javascript;
    }

    location = /_app/preview-page-runtime.mjs {
        alias /srv/knowledge/scripts/lib/preview-page-runtime.mjs;
        default_type application/javascript;
    }

    location = /_app/preview-page-styles.mjs {
        alias /srv/knowledge/scripts/lib/preview-page-styles.mjs;
        default_type application/javascript;
    }

    location ^~ /_vendor/ {
        root /usr/share/nginx/html;
        types {
            application/javascript js mjs;
        }
        try_files $uri =404;
    }

    location ~ (^|/)\. {
        return 404;
    }

    location /learn/ {
        root /srv/knowledge;
        try_files $uri $uri/ =404;
    }

    location / {
        return 404;
    }
}
