>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"node default\" id=\"personal-learn-learn-frontend-browser-chrome-extension-architecture-md-2-flowchart-B-1\" data-look=\"classic\" transform=\"translate(340.5078125, 47)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-116.1796875\" y=\"-27\" width=\"232.359375\" height=\"54\"/>\u003cg class=\"label\" style=\"\" transform=\"translate(-86.1796875, -12)\">\u003crect/>\u003cforeignObject width=\"172.359375\" height=\"24\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\">\u003cspan class=\"nodeLabel\">\u003cp>被诱导的 Content Script\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"node default\" id=\"personal-learn-learn-frontend-browser-chrome-extension-architecture-md-2-flowchart-C-2\" data-look=\"classic\" transform=\"translate(600.6875, 47)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-94\" y=\"-27\" width=\"188\" height=\"54\"/>\u003cg class=\"label\" style=\"\" transform=\"translate(-64, -12)\">\u003crect/>\u003cforeignObject width=\"128\" height=\"24\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\">\u003cspan class=\"nodeLabel\">\u003cp>过宽的消息处理器\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"node default\" id=\"personal-learn-learn-frontend-browser-chrome-extension-architecture-md-2-flowchart-D-3\" data-look=\"classic\" transform=\"translate(846.7109375, 47)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-102.0234375\" y=\"-27\" width=\"204.046875\" height=\"54\"/>\u003cg class=\"label\" style=\"\" transform=\"translate(-72.0234375, -12)\">\u003crect/>\u003cforeignObject width=\"144.046875\" height=\"24\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\">\u003cspan class=\"nodeLabel\">\u003cp>Service Worker 特权\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"node default\" id=\"personal-learn-learn-frontend-browser-chrome-extension-architecture-md-2-flowchart-E-4\" data-look=\"classic\" transform=\"translate(1128.734375, 47)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-130\" y=\"-39\" width=\"260\" height=\"78\"/>\u003cg class=\"label\" style=\"\" transform=\"translate(-100, -24)\">\u003crect/>\u003cforeignObject width=\"200\" height=\"48\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;\">\u003cspan class=\"nodeLabel\">\u003cp>Cookie / 浏览历史 / 跨域请求 / 标签页\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003cdefs>\u003cfilter id=\"personal-learn-learn-frontend-browser-chrome-extension-architecture-md-2-drop-shadow\" height=\"130%\" width=\"130%\">\u003cfeDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"/>\u003c/filter>\u003c/defs>\u003cdefs>\u003cfilter id=\"personal-learn-learn-frontend-browser-chrome-extension-architecture-md-2-drop-shadow-small\" height=\"150%\" width=\"150%\">\u003cfeDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"/>\u003c/filter>\u003c/defs>\u003c/svg>\u003c/figure>\u003cp>所以安全审查应围绕“非特权输入能否组合成特权行为”展开：\u003c/p>\n\u003cul>\n\u003cli>是否能让后台请求任意 URL；\u003c/li>\n\u003cli>是否能让后台向任意 tab 注入代码；\u003c/li>\n\u003cli>是否把令牌、历史记录或跨域响应回传给 content script；\u003c/li>\n\u003cli>是否用 \u003ccode>innerHTML\u003c/code>、\u003ccode>eval\u003c/code> 或字符串拼接解释不可信数据；\u003c/li>\n\u003cli>是否把 web-accessible resources 暴露得过宽；\u003c/li>\n\u003cli>是否保护发布账号和更新链路。\u003c/li>\n\u003c/ul>\n\u003cp>MV3 禁止远程托管代码，是在缩小“商店审核后的代码仍可远程改变”这一供应链缺口，但它并不替代依赖审计、构建可复现性和发布账号保护。\u003ca href=\"https://developer.chrome.com/docs/extensions/develop/migrate/what-is-mv3\">Chrome：Manifest V3\u003c/a>\u003c/p>\n\u003ch2>五、声明式 API 体现的是控制权转移\u003c/h2>\n\u003cp>Manifest V2 时代，扩展可以在请求关键路径中运行任意逻辑。MV3 更强调 \u003ccode>declarativeNetRequest\u003c/code>：扩展提交规则，由浏览器在网络栈中执行，不必把请求内容暴露给扩展进程。官方明确将其隐私优势描述为“无需拦截并查看请求内容即可修改请求”。\u003ca href=\"https://developer.chrome.com/docs/extensions/reference/api/declarativeNetRequest\">Chrome：declarativeNetRequest\u003c/a>\u003c/p>\n\u003cp>这是一种通用系统设计取舍：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>模型\u003c/th>\n\u003cth>优势\u003c/th>\n\u003cth>代价\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>命令式拦截\u003c/td>\n\u003ctd>表达力强，可运行任意上下文逻辑\u003c/td>\n\u003ctd>难审计、可能阻塞关键路径、扩大数据可见范围\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>声明式规则\u003c/td>\n\u003ctd>浏览器可预验证、优化、限制权限和资源\u003c/td>\n\u003ctd>表达能力受规则模型与配额约束\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003ccode>declarativeNetRequest\u003c/code> 支持静态、动态和 session 规则：静态规则随包发布，动态规则跨浏览器会话和扩展升级持久化，session 规则会在浏览器关闭或扩展升级时清除。\u003ca href=\"https://developer.chrome.com/docs/extensions/reference/api/declarativeNetRequest#rules-and-rulesets\">Chrome：Rules and rulesets\u003c/a>\u003c/p>\n\u003cp>不要把声明式模型理解成“阉割后的 API”。它是在安全敏感、性能敏感的共享基础设施上，把任意代码转换成受限数据结构。浏览器、操作系统策略、数据库查询规划和云 IAM 中都能看到类似思想：\u003cstrong>牺牲局部表达力，换取全局可分析性和可治理性\u003c/strong>。\u003c/p>\n\u003ch2>六、UI 形态应服从任务持续时间\u003c/h2>\n\u003cp>插件 UI 不是越多越完整。选择依据应是任务与浏览上下文的关系：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Action popup\u003c/strong>：几秒内完成的命令、状态查看、一次性触发。不要放会因失焦中断的编辑任务。\u003c/li>\n\u003cli>\u003cstrong>Side panel\u003c/strong>：阅读助手、知识整理、跨页面参考等需要与网页并行且持续存在的工作区。side panel 可配置为跨标签导航保持，并作为 extension page 使用 Chrome API。\u003ca href=\"https://developer.chrome.com/docs/extensions/reference/api/sidePanel\">Chrome：Side Panel API\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>页面内 UI\u003c/strong>：必须与 DOM 元素空间绑定的增强功能。应处理 SPA 导航、DOM 重建、样式隔离和页面 CSP。\u003c/li>\n\u003cli>\u003cstrong>Options page\u003c/strong>：低频设置、账号连接、权限解释。\u003c/li>\n\u003cli>\u003cstrong>DevTools panel\u003c/strong>：网络、性能、组件树、审计等开发者工作流；它的生命周期依附于 DevTools。\u003c/li>\n\u003cli>\u003cstrong>Offscreen document\u003c/strong>：后台确实需要 DOM 能力时的受限执行上下文，不是隐形 UI。service worker 无 DOM，而 offscreen document 只有 \u003ccode>runtime\u003c/code> 扩展 API 可直接使用，协作主要依靠消息。\u003ca href=\"https://developer.chrome.com/docs/extensions/reference/api/offscreen\">Chrome：Offscreen API\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp>一个简单判断：\u003cstrong>任务需要和页面并排多久，用户是否需要看到状态，任务能否在 UI 消失后继续？\u003c/strong> 这三个问题比“React 应该挂在哪里”更早决定架构。\u003c/p>\n\u003ch2>七、四种常见架构\u003c/h2>\n\u003ch3>1. 页面增强器\u003c/h3>\n\u003cp>适用：标注、翻译、表单辅助、无障碍增强。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">content script = DOM 适配层\nservice worker = 授权、跨域访问、全局配置\n页面内 UI = 与目标元素绑定的局部视图\n\u003c/code>\u003c/pre>\n\u003cp>难点是页面变化而不是 API 调用：SPA 路由、虚拟列表、Shadow DOM、iframe、页面自身样式和 CSP 都会破坏天真的选择器方案。应把站点适配器与通用业务核心分开，并把 DOM 观察限制在最小子树。\u003c/p>\n\u003ch3>2. 浏览伴侣\u003c/h3>\n\u003cp>适用：阅读研究、AI 助手、书签与知识整理。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">side panel = 长时交互与工作集\ncontent script = 当前页面语义采集\nservice worker = 权限、任务调度、跨标签协调\nstorage = 会话恢复与本地索引\n\u003c/code>\u003c/pre>\n\u003cp>难点是“当前页面”“当前标签”“用户工作集”三种状态不能混为一谈。标签变化是事件，工作集是持久业务状态，side panel 只是其投影。\u003c/p>\n\u003ch3>3. DevTools 扩展\u003c/h3>\n\u003cp>适用：框架调试器、网络诊断、性能审计。\u003c/p>\n\u003cp>DevTools page 负责注册 panel 并连接被检查页面；service worker 处理扩展级能力。不要假设 DevTools 的上下文与普通 extension page 相同，也不要把调试连接当成永久通道。\u003c/p>\n\u003ch3>4. 网络策略扩展\u003c/h3>\n\u003cp>适用：拦截、重定向、隐私过滤、请求头策略。\u003c/p>\n\u003cp>优先判断规则能否表达为 \u003ccode>declarativeNetRequest\u003c/code>。若业务依赖完整响应体、任意异步决策或精确的跨请求状态机，就要承认平台边界，而不是通过隐藏页面或保活技巧模拟旧架构。\u003c/p>\n\u003ch2>八、生产故障通常发生在哪里\u003c/h2>\n\u003ch3>生命周期错觉\u003c/h3>\n\u003cp>症状：开发模式正常，空闲一段时间后状态丢失或监听失效。\u003c/p>\n\u003cp>根因：初始化逻辑依赖全局变量，或事件监听器不是顶层同步注册。修复方向是持久化、可重入初始化和事件级事务。\u003c/p>\n\u003ch3>消息协议漂移\u003c/h3>\n\u003cp>症状：某个 UI 更新后与旧 content script 不兼容，Promise 永不结束，错误只出现在用户浏览器。\u003c/p>\n\u003cp>根因：把消息当内部函数调用，没有版本、超时、错误码和兼容策略。\u003c/p>\n\u003ch3>权限与产品价值不匹配\u003c/h3>\n\u003cp>症状：安装转化低、更新触发新警告、审核变慢。\u003c/p>\n\u003cp>根因：权限按开发便利性声明，而非按用户可理解的动作申请。\u003c/p>\n\u003ch3>页面集成脆弱\u003c/h3>\n\u003cp>症状：目标站小改版即失效，MutationObserver 造成高 CPU，样式污染页面。\u003c/p>\n\u003cp>根因：业务逻辑与 DOM 结构耦合，没有适配层、观察边界和降级策略。\u003c/p>\n\u003ch3>跨上下文状态竞争\u003c/h3>\n\u003cp>症状：popup、side panel 和页面显示不同状态，快速切换标签时响应串线。\u003c/p>\n\u003cp>根因：多个 UI 都自认为是真相来源，请求没有 tab/frame/版本标识，也没有“最后写入者”之外的冲突语义。\u003c/p>\n\u003ch3>本地正常、发布失败\u003c/h3>\n\u003cp>症状：打包后动态导入、Wasm、source map、CSP 或远程代码行为变化。\u003c/p>\n\u003cp>根因：开发服务器与扩展包的执行约束不同。发布构建必须在 unpacked extension 和接近商店包的条件下测试。\u003c/p>\n\u003ch2>九、架构评审清单\u003c/h2>\n\u003cp>在选框架和写页面前，先回答：\u003c/p>\n\u003col>\n\u003cli>哪些输入来自网页或外部来源？它们进入特权区前如何验证？\u003c/li>\n\u003cli>每项权限对应哪个用户可理解的功能？能否改成 \u003ccode>activeTab\u003c/code> 或可选权限？\u003c/li>\n\u003cli>service worker 在任意 \u003ccode>await\u003c/code> 后被终止，系统能否恢复？\u003c/li>\n\u003cli>哪些状态是持久真相，哪些只是可丢弃缓存？\u003c/li>\n\u003cli>消息是否有 schema、版本、关联 ID、超时和结构化错误？\u003c/li>\n\u003cli>页面导航、iframe、多个 tab 和多个 frame 如何标识？\u003c/li>\n\u003cli>UI 关闭后任务是否继续？结果如何重新订阅？\u003c/li>\n\u003cli>远程服务不可用、限流或返回恶意数据时，权限边界是否仍成立？\u003c/li>\n\u003cli>插件更新时，存储、规则和 content script 的版本如何迁移？\u003c/li>\n\u003cli>是否能解释“如果发布账号或某个依赖被攻陷，最大损害是什么”？\u003c/li>\n\u003c/ol>\n\u003ch2>十、真正值得掌握的精髓\u003c/h2>\n\u003cp>Chrome 插件开发把几类高级工程问题压缩到了一个小型应用中：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>操作系统式能力安全\u003c/strong>：manifest 和 permissions 类似 capability system，不应退化为全局管理员权限。\u003c/li>\n\u003cli>\u003cstrong>分布式系统式状态管理\u003c/strong>：多个生命周期不一致的上下文通过消息协作，必须考虑重试、乱序、版本和恢复。\u003c/li>\n\u003cli>\u003cstrong>事件溯源式后台设计\u003c/strong>：service worker 的短生命周期迫使业务从“常驻对象”转向“事件 + 持久状态”。\u003c/li>\n\u003cli>\u003cstrong>声明式治理\u003c/strong>：平台把部分任意代码收敛成可审查、可限额、可优化的规则。\u003c/li>\n\u003cli>\u003cstrong>零信任式边界\u003c/strong>：content script 是接近攻击面的适配器，不是可信内网。\u003c/li>\n\u003c/ul>\n\u003cp>掌握这些模型后，换 UI 框架、构建工具或某个 Chrome API 只是局部变化。反过来，如果仍把插件理解为“popup + background.js + content.js 三个文件”，功能越复杂，生命周期、安全和状态问题越会以偶发故障的方式回来。\u003c/p>\n\u003ch2>延伸阅读\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"https://developer.chrome.com/docs/extensions/develop\">Chrome Extensions 开发文档\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://developer.chrome.com/docs/extensions/develop/migrate/what-is-mv3\">Manifest V3 的目标与变化\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://developer.chrome.com/docs/extensions/develop/concepts/service-workers/lifecycle\">Extension service worker 生命周期\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://developer.chrome.com/docs/extensions/develop/concepts/content-scripts\">Content scripts 与 isolated world\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://developer.chrome.com/docs/extensions/develop/concepts/messaging\">消息通信及其安全边界\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://developer.chrome.com/docs/extensions/develop/concepts/declare-permissions\">权限声明模型\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://developer.chrome.com/docs/extensions/develop/security-privacy/stay-secure\">Chrome Extension 安全建议\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://developer.chrome.com/docs/extensions/reference/api/declarativeNetRequest\">Declarative Net Request API\u003c/a>\u003c/li>\n\u003c/ul>\n"},"codex-high-efficiency-guide":{"id":"codex-high-efficiency-guide","title":"Codex：从上手到高效协作","relativePath":"learn/ai/tools/codex-high-efficiency-guide.md","html":"\u003ch1>Codex：从上手到高效协作\u003c/h1>\n\u003cp>Codex 最适合被当成“会读仓库、会改代码、会做验证的协作者”，而不是只会聊天的工具。对一个有多年前端经验的人来说，真正的收益不在于让它替你做所有决定，而在于让它把重复劳动、跨文件追踪、初稿生成和机械验证变得更快。\u003c/p>\n\u003cp>这篇指南的目标很具体：帮你建立一套稳定的使用习惯，让你在真实项目里更快地把 Codex 用起来、用得准、用得稳。它不是课程表式的“学习清单”，而是一份可以直接照着执行的工作手册。\u003c/p>\n\u003ch2>1. 先建立心智模型\u003c/h2>\n\u003cp>Codex 不是“更聪明的搜索框”，而是一个围绕任务执行组织起来的工作流。你提供目标、边界和验收标准，它负责理解上下文、提出计划、执行变更、给出结果；你负责保留产品判断、风险判断和最终决策。\u003c/p>\n\u003cp>最有效的协作方式通常不是“帮我改一下”，而是“先理解，再计划，再改，再验证”。当任务越复杂，这个顺序越重要。\u003c/p>\n\u003ch3>适合把 Codex 当主力的任务\u003c/h3>\n\u003cul>\n\u003cli>需要读很多文件才能看清结构的代码库任务\u003c/li>\n\u003cli>跨多个文件的重构、修复、文档整理\u003c/li>\n\u003cli>需要先分析再动手的 bug 排查\u003c/li>\n\u003cli>需要生成一致风格内容的知识库文档\u003c/li>\n\u003cli>需要把机械性验证跑一遍的改动\u003c/li>\n\u003c/ul>\n\u003ch3>不适合一上来就丢给 Codex 的任务\u003c/h3>\n\u003cul>\n\u003cli>你自己还没想清边界的开放式想法\u003c/li>\n\u003cli>只改一个很小的局部，手工更快\u003c/li>\n\u003cli>依赖隐性业务背景、但你又没有提供给它\u003c/li>\n\u003cli>不能接受试错或回滚成本很高的改动\u003c/li>\n\u003cli>没有办法验证对错的模糊判断题\u003c/li>\n\u003c/ul>\n\u003ch3>一个实用的判断标准\u003c/h3>\n\u003cp>如果你能把任务说清楚这四件事，Codex 往往就能开始干活：\u003c/p>\n\u003col>\n\u003cli>你想达成什么结果。\u003c/li>\n\u003cli>哪些地方不能碰。\u003c/li>\n\u003cli>你希望它先分析还是直接修改。\u003c/li>\n\u003cli>做完以后如何算通过。\u003c/li>\n\u003c/ol>\n\u003ch2>2. 概念地图\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>层级\u003c/th>\n\u003cth>重点概念\u003c/th>\n\u003cth>你要先掌握什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>🟢 基础\u003c/td>\n\u003ctd>任务边界、仓库上下文、变更审查、验证闭环\u003c/td>\n\u003ctd>先学会把任务说清楚，并且知道怎么判断“做对了没有”\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>🔵 进阶\u003c/td>\n\u003ctd>计划-执行-复核循环、提示词约束、知识库工作流、重复任务模板\u003c/td>\n\u003ctd>学会让 Codex 按你的节奏工作，而不是被它带着跑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>🔴 高阶\u003c/td>\n\u003ctd>可复用工作流、长任务协作、多上下文协调、风险控制\u003c/td>\n\u003ctd>把零散使用变成个人方法论和稳定产能\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>什么时候该怎么用\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>场景\u003c/th>\n\u003cth>更好的 Codex 用法\u003c/th>\n\u003cth>你要盯住的点\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>先读后改\u003c/td>\n\u003ctd>先让它总结仓库结构，再做变更\u003c/td>\n\u003ctd>是否真的理解了上下文\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>跨文件修改\u003c/td>\n\u003ctd>先要计划，再做改动\u003c/td>\n\u003ctd>是否列出了受影响文件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>修 bug\u003c/td>\n\u003ctd>先让它给出可能根因和验证路径\u003c/td>\n\u003ctd>是否把“猜测”区分开了\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>写知识文档\u003c/td>\n\u003ctd>先给读者画像和深度要求\u003c/td>\n\u003ctd>是否避免了泛泛而谈\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>重要改动\u003c/td>\n\u003ctd>要求列风险、回滚点和验证结果\u003c/td>\n\u003ctd>是否保留了人工把关\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2>3. 4 周上手路径\u003c/h2>\n\u003cp>这是一条适合“先会用，再用顺”的学习路径。每周只抓一个主题，避免一开始就把 Codex 当成万能助手。\u003c/p>\n\u003ch3>第 1 周：先跑通最小闭环\u003c/h3>\n\u003cp>这一周只做一件事：学会让 Codex 读懂你的仓库，并产出一个你能审核的初稿。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Day 1\u003c/strong>：让 Codex 用自己的话总结仓库结构、主要目录、当前知识地图。\u003c/li>\n\u003cli>\u003cstrong>Day 2\u003c/strong>：给它一个很小的文档任务，要求“只改一篇文章，不碰其他文件”。\u003c/li>\n\u003cli>\u003cstrong>Day 3\u003c/strong>：练习给出边界条件，例如“跳过基础介绍，重点讲架构和取舍”。\u003c/li>\n\u003cli>\u003cstrong>Day 4\u003c/strong>：让它先列计划，再执行，观察两种输出的差异。\u003c/li>\n\u003cli>\u003cstrong>Day 5\u003c/strong>：检查 diff，确认你能看懂每一处修改为什么存在。\u003c/li>\n\u003c/ul>\n\u003ch3>第 2 周：学会提问和收边界\u003c/h3>\n\u003cp>这一周重点不是“让它更努力”，而是“让它更少猜”。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Day 1\u003c/strong>：练习把任务拆成目标、约束、输出格式、验收标准。\u003c/li>\n\u003cli>\u003cstrong>Day 2\u003c/strong>：要求它在不确定时先提问，别直接编答案。\u003c/li>\n\u003cli>\u003cstrong>Day 3\u003c/strong>：练习给出负面约束，例如“不要改 README 以外的入口文件”。\u003c/li>\n\u003cli>\u003cstrong>Day 4\u003c/strong>：让它输出 2 到 3 个方案，并解释取舍。\u003c/li>\n\u003cli>\u003cstrong>Day 5\u003c/strong>：复盘哪些提示词让输出明显更稳定。\u003c/li>\n\u003c/ul>\n\u003ch3>第 3 周：把 Codex 接到真实工作流里\u003c/h3>\n\u003cp>开始把它放进你平时真的会做的事：改文档、改组件、修问题、整理知识。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Day 1\u003c/strong>：让它先做代码或文档阅读，再让你决定是否动手。\u003c/li>\n\u003cli>\u003cstrong>Day 2\u003c/strong>：尝试一次跨文件修改，但要求它说明会改哪些入口。\u003c/li>\n\u003cli>\u003cstrong>Day 3\u003c/strong>：把验证步骤写进任务里，例如 lint、测试、构建或人工检查。\u003c/li>\n\u003cli>\u003cstrong>Day 4\u003c/strong>：练习让它解释为什么选择某种方案，而不是只给结果。\u003c/li>\n\u003cli>\u003cstrong>Day 5\u003c/strong>：整理一份自己的“常用任务模板”。\u003c/li>\n\u003c/ul>\n\u003ch3>第 4 周：建立你的个人方法论\u003c/h3>\n\u003cp>这一周开始追求效率和稳定性：什么该交给 Codex，什么该自己做。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Day 1\u003c/strong>：把高频任务整理成 5 个模板。\u003c/li>\n\u003cli>\u003cstrong>Day 2\u003c/strong>：为每个模板写清楚输入、输出和验收。\u003c/li>\n\u003cli>\u003cstrong>Day 3\u003c/strong>：把最常见的失败模式列出来。\u003c/li>\n\u003cli>\u003cstrong>Day 4\u003c/strong>：尝试把一条稳定工作流沉淀成可复用说明。\u003c/li>\n\u003cli>\u003cstrong>Day 5\u003c/strong>：回头看一遍：哪些任务明显被加速，哪些其实不值得用 Codex。\u003c/li>\n\u003c/ul>\n\u003ch2>4. 第一次接入你的仓库\u003c/h2>\n\u003cp>Codex 不是独立于仓库存在的，它的价值很大一部分来自你给它的上下文质量。所以第一次使用时，不要急着追求“大任务”，先把基础准备做好。\u003c/p>\n\u003ch3>你需要准备的东西\u003c/h3>\n\u003cul>\n\u003cli>一个明确的仓库或工作区。\u003c/li>\n\u003cli>一个可靠的验证命令，比如 lint、test、build 中至少一个。\u003c/li>\n\u003cli>一份简短的读者/使用者画像，告诉 Codex 你要它面向谁写。\u003c/li>\n\u003cli>一条你愿意让它修改的小任务，最好是文档或局部重构。\u003c/li>\n\u003cli>一个能接受审阅的变更标准，比如“只改这 2 个文件”。\u003c/li>\n\u003c/ul>\n\u003ch3>最小可用流程\u003c/h3>\n\u003col>\n\u003cli>先给 Codex 读仓库，而不是先给结论。\u003c/li>\n\u003cli>让它复述任务、边界和风险。\u003c/li>\n\u003cli>如果任务复杂，先要计划，不要马上改。\u003c/li>\n\u003cli>修改完成后，要求它输出变更摘要和验证结果。\u003c/li>\n\u003cli>你再做最终判断。\u003c/li>\n\u003c/ol>\n\u003ch3>一个很好的第一次任务\u003c/h3>\n\u003cp>把你仓库里的某篇文章交给 Codex，让它做三件事：\u003c/p>\n\u003col>\n\u003cli>先总结这篇文章在讲什么。\u003c/li>\n\u003cli>再指出哪里过于啰嗦、哪里还不够深入。\u003c/li>\n\u003cli>最后给出一个只修改当前文章的精简重写版本。\u003c/li>\n\u003c/ol>\n\u003cp>这个任务足够小，能帮你建立信心；又足够真实，能让你看到 Codex 的工作方式。\u003c/p>\n\u003ch2>5. 深入理解 9 个核心概念\u003c/h2>\n\u003ch3>🟢 任务边界\u003c/h3>\n\u003cp>\u003cstrong>是什么\u003c/strong>：你先明确要解决什么，不要让 Codex 猜你的真实意图。\u003cbr>\u003cstrong>为什么重要\u003c/strong>：边界不清，Codex 往往会“做得很多，但不是你要的那一块”。\u003cbr>\u003cstrong>怎么运作\u003c/strong>：把目标、约束、禁止项、验收条件写出来。\u003cbr>\u003cstrong>常见坑\u003c/strong>：任务太泛、允许范围太大、没有写“不许碰什么”。\u003c/p>\n\u003ch4>练习\u003c/h4>\n\u003col>\n\u003cli>把“帮我优化这个文档”改写成带边界的任务。\u003c/li>\n\u003cli>给同一个任务写一个“宽边界版”和“窄边界版”。\u003c/li>\n\u003cli>比较两者输出，看看哪一个更接近你的真实意图。\u003c/li>\n\u003c/ol>\n\u003ch3>🟢 仓库上下文\u003c/h3>\n\u003cp>\u003cstrong>是什么\u003c/strong>：Codex 不是凭空理解问题，它依赖仓库里的结构、文件和历史。\u003cbr>\u003cstrong>为什么重要\u003c/strong>：上下文决定它是“看懂你在做什么”还是“只会说得像懂”。\u003cbr>\u003cstrong>怎么运作\u003c/strong>：先让它总结目录、关键入口、约定和当前状态。\u003cbr>\u003cstrong>常见坑\u003c/strong>：直接贴一句需求，不给仓库结构；上下文太长但没有重点。\u003c/p>\n\u003ch4>练习\u003c/h4>\n\u003col>\n\u003cli>让 Codex 用 10 句话概括你的仓库。\u003c/li>\n\u003cli>让它找出最重要的 3 个入口文件。\u003c/li>\n\u003cli>让它说明这份知识库的写作原则是什么。\u003c/li>\n\u003c/ol>\n\u003ch3>🟢 变更审查\u003c/h3>\n\u003cp>\u003cstrong>是什么\u003c/strong>：看 diff，而不是只看“它说自己做完了”。\u003cbr>\u003cstrong>为什么重要\u003c/strong>：你真正要信的是变更本身，不是信心表述。\u003cbr>\u003cstrong>怎么运作\u003c/strong>：要求它先总结，再给出具体改动点，最后你自己审查。\u003cbr>\u003cstrong>常见坑\u003c/strong>：不看 diff、只看总结、把“完成”当成“正确”。\u003c/p>\n\u003ch4>练习\u003c/h4>\n\u003col>\n\u003cli>对同一个任务，先看摘要，再看 diff，比较差异。\u003c/li>\n\u003cli>让 Codex 说明每个改动的理由。\u003c/li>\n\u003cli>找一处你不接受的修改，让它回滚并解释。\u003c/li>\n\u003c/ol>\n\u003ch3>🟢 验证闭环\u003c/h3>\n\u003cp>\u003cstrong>是什么\u003c/strong>：改完以后有一个明确的验证办法。\u003cbr>\u003cstrong>为什么重要\u003c/strong>：没有验证，Codex 只是帮你更快地产生不确定性。\u003cbr>\u003cstrong>怎么运作\u003c/strong>：把测试、lint、构建、人工检查中的一种或几种写进任务里。\u003cbr>\u003cstrong>常见坑\u003c/strong>：只要“看起来对”，没有实际检查；验证标准太模糊。\u003c/p>\n\u003ch4>练习\u003c/h4>\n\u003col>\n\u003cli>给一个文档任务写出验证标准。\u003c/li>\n\u003cli>给一个代码任务写出最小验证命令。\u003c/li>\n\u003cli>让 Codex 报告它做了哪些验证。\u003c/li>\n\u003c/ol>\n\u003ch3>🔵 计划-执行-复核循环\u003c/h3>\n\u003cp>\u003cstrong>是什么\u003c/strong>：先计划，再执行，再复核。\u003cbr>\u003cstrong>为什么重要\u003c/strong>：复杂任务里，这个循环能显著降低返工。\u003cbr>\u003cstrong>怎么运作\u003c/strong>：先让它给方案和风险，再动手，最后复查结果。\u003cbr>\u003cstrong>常见坑\u003c/strong>：直接进入修改；计划和执行混在一起，导致你没法判断它到底理解了没。\u003c/p>\n\u003ch4>练习\u003c/h4>\n\u003col>\n\u003cli>把一个小任务拆成计划和执行两步。\u003c/li>\n\u003cli>比较“先改后说”和“先说后改”的输出质量。\u003c/li>\n\u003cli>给计划增加“失败怎么办”这一项。\u003c/li>\n\u003c/ol>\n\u003ch3>🔵 提示词约束\u003c/h3>\n\u003cp>\u003cstrong>是什么\u003c/strong>：不是多说就更好，而是要把约束说准。\u003cbr>\u003cstrong>为什么重要\u003c/strong>：Codex 的输出质量很大程度上取决于你给了什么边界。\u003cbr>\u003cstrong>怎么运作\u003c/strong>：明确目标、风格、范围、禁止项、输出格式。\u003cbr>\u003cstrong>常见坑\u003c/strong>：一个提示词塞太多要求；没有指定输出形式；没有强调“不要做什么”。\u003c/p>\n\u003ch4>练习\u003c/h4>\n\u003col>\n\u003cli>写一个“先分析，不要改代码”的提示词。\u003c/li>\n\u003cli>写一个“只改当前文件”的提示词。\u003c/li>\n\u003cli>写一个“输出风险清单”的提示词。\u003c/li>\n\u003c/ol>\n\u003ch3>🔵 知识库工作流\u003c/h3>\n\u003cp>\u003cstrong>是什么\u003c/strong>：让 Codex 帮你持续维护一套自己的知识库，而不是一次性产出内容。\u003cbr>\u003cstrong>为什么重要\u003c/strong>：对于学习型仓库，持续更新比单篇质量更重要。\u003cbr>\u003cstrong>怎么运作\u003c/strong>：先定读者画像，再定文章深度，再让它按统一结构生产内容。\u003cbr>\u003cstrong>常见坑\u003c/strong>：写成百科、堆术语、没有把你的经验背景转成写作规则。\u003c/p>\n\u003ch4>练习\u003c/h4>\n\u003col>\n\u003cli>让 Codex 为你现有仓库写一份知识地图。\u003c/li>\n\u003cli>让它基于读者画像改写一篇过浅的文章。\u003c/li>\n\u003cli>让它给 README 加一条新文档入口。\u003c/li>\n\u003c/ol>\n\u003ch3>🔴 可复用工作流\u003c/h3>\n\u003cp>\u003cstrong>是什么\u003c/strong>：把常用任务整理成模板，让 Codex 反复执行同一类工作。\u003cbr>\u003cstrong>为什么重要\u003c/strong>：真正省时间的不是一次任务，而是一整类任务被标准化。\u003cbr>\u003cstrong>怎么运作\u003c/strong>：把输入、步骤、验证、失败处理都写成固定套路。\u003cbr>\u003cstrong>常见坑\u003c/strong>：每次都重新解释；模板太长；把模板写成教条。\u003c/p>\n\u003ch4>练习\u003c/h4>\n\u003col>\n\u003cli>为“写文档”建立一个模板。\u003c/li>\n\u003cli>为“修 bug”建立一个模板。\u003c/li>\n\u003cli>为“知识库文章重写”建立一个模板。\u003c/li>\n\u003c/ol>\n\u003ch3>🔴 长任务协作\u003c/h3>\n\u003cp>\u003cstrong>是什么\u003c/strong>：把一个大目标拆成多个可验证的小步，让 Codex 逐步推进。\u003cbr>\u003cstrong>为什么重要\u003c/strong>：复杂工作里，单次输出很难完美，分段推进更稳。\u003cbr>\u003cstrong>怎么运作\u003c/strong>：每一步都能检查状态、调整方向、决定是否继续。\u003cbr>\u003cstrong>常见坑\u003c/strong>：一步要求太多；中途不复核；让它在关键决策上替你拍板。\u003c/p>\n\u003ch4>练习\u003c/h4>\n\u003col>\n\u003cli>把一个大改造拆成 3 步。\u003c/li>\n\u003cli>为每一步写验收条件。\u003c/li>\n\u003cli>观察哪里最容易偏题。\u003c/li>\n\u003c/ol>\n\u003ch3>🔴 风险控制与安全边界\u003c/h3>\n\u003cp>\u003cstrong>是什么\u003c/strong>：知道什么时候要停、什么时候必须人工确认。\u003cbr>\u003cstrong>为什么重要\u003c/strong>：效率不是越放手越好，重要改动需要可控。\u003cbr>\u003cstrong>怎么运作\u003c/strong>：对高风险操作、不可逆操作、外部系统操作设边界。\u003cbr>\u003cstrong>常见坑\u003c/strong>：把任何任务都当成可以自动完成；没有回滚思路；忽略权限和外部影响。\u003c/p>\n\u003ch4>练习\u003c/h4>\n\u003col>\n\u003cli>给你最常做的一类任务写“停止条件”。\u003c/li>\n\u003cli>找出一类绝不能让 Codex 直接做主的操作。\u003c/li>\n\u003cli>把回滚思路写进你的提示词模板。\u003c/li>\n\u003c/ol>\n\u003ch2>6. 常用工作表面与生态\u003c/h2>\n\u003cp>这里不把 Codex 当成孤立工具看，而是把它放进你真实会接触的工作表面里。\u003c/p>\n\u003ch3>\u003ca href=\"https://developers.openai.com/\">OpenAI Codex 官方产品页\u003c/a>\u003c/h3>\n\u003cp>\u003cstrong>它是什么\u003c/strong>：Codex 的官方入口和能力介绍。\u003cbr>\u003cstrong>什么时候用\u003c/strong>：你想确认当前产品定位、工作方式和官方建议时。\u003cbr>\u003cstrong>最简单用法\u003c/strong>：先看官方定位，再决定自己的使用场景。  \u003c/p>\n\u003ch3>\u003ca href=\"https://developers.openai.com/codex/use-cases\">Codex Use Cases\u003c/a>\u003c/h3>\n\u003cp>\u003cstrong>它是什么\u003c/strong>：官方整理的典型使用场景。\u003cbr>\u003cstrong>什么时候用\u003c/strong>：你不确定 Codex 能帮你处理哪类任务时。\u003cbr>\u003cstrong>最简单用法\u003c/strong>：把你的任务对照它的用例，看是否适合交给 Codex。  \u003c/p>\n\u003ch3>Git / diff / branch\u003c/h3>\n\u003cp>\u003cstrong>它是什么\u003c/strong>：你和 Codex 共同工作的可审查边界。\u003cbr>\u003cstrong>什么时候用\u003c/strong>：几乎所有需要真实改动的任务。\u003cbr>\u003cstrong>最简单用法\u003c/strong>：让每次变化都能被 diff 看见、被回退。  \u003c/p>\n\u003ch3>Skills\u003c/h3>\n\u003cp>\u003cstrong>它是什么\u003c/strong>：把重复工作流程沉淀成可复用的工作方式。\u003cbr>\u003cstrong>什么时候用\u003c/strong>：当你发现自己重复说同一套要求时。\u003cbr>\u003cstrong>最简单用法\u003c/strong>：把“写知识库文章”或“修 bug”整理成固定流程。  \u003c/p>\n\u003ch3>\u003ca href=\"https://developers.openai.com/api/docs/guides/latest-model\">版本与模型指引\u003c/a>\u003c/h3>\n\u003cp>\u003cstrong>它是什么\u003c/strong>：官方关于当前模型和提示方式的说明。\u003cbr>\u003cstrong>什么时候用\u003c/strong>：当你发现行为变化、输出风格变化，或者需要重新校准提示词时。\u003cbr>\u003cstrong>最简单用法\u003c/strong>：先看官方最新指引，再决定要不要改你的模板。  \u003c/p>\n\u003ch3>文档 / 知识库仓库\u003c/h3>\n\u003cp>\u003cstrong>它是什么\u003c/strong>：Codex 最适合长期服务的地方之一。\u003cbr>\u003cstrong>什么时候用\u003c/strong>：当你要持续产出结构统一、可追踪的知识文档时。\u003cbr>\u003cstrong>最简单用法\u003c/strong>：让它基于读者画像、深度要求和来源去重写内容。  \u003c/p>\n\u003ch2>7. 3 个项目练习\u003c/h2>\n\u003ch3>1. 你的 Codex 提示词手册\u003c/h3>\n\u003cp>\u003cstrong>你要做什么\u003c/strong>：整理一份自己的常用提示词模板。\u003cbr>\u003cstrong>练到什么\u003c/strong>：任务边界、约束、验证闭环。\u003cbr>\u003cstrong>为什么适合入门\u003c/strong>：这是最小成本的个人化，能立刻提高输出稳定性。\u003c/p>\n\u003cp>\u003cstrong>功能清单\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>任务说明模板\u003c/li>\n\u003cli>先分析后修改模板\u003c/li>\n\u003cli>文档重写模板\u003c/li>\n\u003cli>风险和验证模板\u003c/li>\n\u003c/ul>\n\u003ch3>2. 知识库文章生成工作流\u003c/h3>\n\u003cp>\u003cstrong>你要做什么\u003c/strong>：让 Codex 按你的读者画像生成或重写文章。\u003cbr>\u003cstrong>练到什么\u003c/strong>：知识库工作流、提示词约束、变更审查。\u003cbr>\u003cstrong>为什么适合进阶\u003c/strong>：它和你当前仓库目标完全一致，能直接提高知识库产出质量。\u003c/p>\n\u003cp>\u003cstrong>功能清单\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>输入主题 + 读者画像\u003c/li>\n\u003cli>输出结构化文章\u003c/li>\n\u003cli>自动更新 README 索引\u003c/li>\n\u003cli>生成来源链接与查证日期\u003c/li>\n\u003c/ul>\n\u003ch3>3. 复杂改动的标准协作流程\u003c/h3>\n\u003cp>\u003cstrong>你要做什么\u003c/strong>：为代码或文档改动建立一个可复用的协作流程。\u003cbr>\u003cstrong>练到什么\u003c/strong>：可复用工作流、长任务协作、风险控制。\u003cbr>\u003cstrong>为什么适合冲刺\u003c/strong>：它最接近真实工作，能把 Codex 真正变成协作者。\u003c/p>\n\u003cp>\u003cstrong>功能清单\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>先总结上下文\u003c/li>\n\u003cli>再给计划\u003c/li>\n\u003cli>再执行改动\u003c/li>\n\u003cli>最后做验证和 diff 审查\u003c/li>\n\u003c/ul>\n\u003ch2>8. 学完以后往哪走\u003c/h2>\n\u003cp>当你已经能稳定地用 Codex 做任务，下一步不该是“更频繁地使用”，而是“更精确地定义工作流”。\u003c/p>\n\u003ch3>可以继续扩展的相邻方向\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Prompt 设计\u003c/strong>：让你的任务描述更短、更稳定、更可复用。\u003c/li>\n\u003cli>\u003cstrong>Skills 设计\u003c/strong>：把高频工作收敛成统一流程。\u003c/li>\n\u003cli>\u003cstrong>Git 工作流\u003c/strong>：让变更、审查、回滚都保持可控。\u003c/li>\n\u003cli>\u003cstrong>文档工程\u003c/strong>：把知识库变成可持续维护的系统，而不是一次性输出。\u003c/li>\n\u003c/ul>\n\u003ch3>还值得继续深挖的 Codex 主题\u003c/h3>\n\u003cul>\n\u003cli>长任务如何切分成可复核的小步\u003c/li>\n\u003cli>什么时候应该先让它提问，而不是直接执行\u003c/li>\n\u003cli>怎么把“读仓库”变成标准动作\u003c/li>\n\u003cli>怎么把个人偏好沉淀成稳定模板\u003c/li>\n\u003c/ul>\n\u003ch3>你可以用来保持更新的官方资源\u003c/h3>\n\u003cul>\n\u003cli>OpenAI 开发者文档首页\u003c/li>\n\u003cli>Codex 官方用例页\u003c/li>\n\u003cli>模型与提示指引页\u003c/li>\n\u003c/ul>\n\u003ch2>9. 资源\u003c/h2>\n\u003ch3>官方文档\u003c/h3>\n\u003cul>\n\u003cli>\u003ca href=\"https://developers.openai.com/\">OpenAI Developers\u003c/a>：官方开发者入口，适合从总览理解 Codex 在 OpenAI 产品体系里的位置。\u003c/li>\n\u003cli>\u003ca href=\"https://developers.openai.com/codex/use-cases\">Codex Use Cases\u003c/a>：官方用例页，适合确认 Codex 适合处理哪些真实任务。\u003c/li>\n\u003cli>\u003ca href=\"https://developers.openai.com/api/docs/guides/latest-model\">Latest model guide\u003c/a>：当你需要重新校准提示词或关注当前推荐模型时，先看这里。\u003c/li>\n\u003c/ul>\n\u003ch3>适合配合阅读的仓库文档\u003c/h3>\n\u003cul>\n\u003cli>\u003ca href=\"personal-learn-config.yaml\">Personal Learn 配置\u003c/a>：记录输出语言、学习目标、已有经验和熟悉领域。\u003c/li>\n\u003cli>\u003ca href=\".agents/skills/personal-learn/SKILL.md\">Personal Learn Skill\u003c/a>：规定知识文档生成前的交互、内容档位和验证流程。\u003c/li>\n\u003c/ul>\n\u003ch2>10. 这篇指南的核心结论\u003c/h2>\n\u003cp>Codex 真正的价值，不是“替你想”，而是“帮你更快地把想法变成可验证的改动”。对你这种已经有成熟前端经验的人来说，最值得追求的不是“让它多做一点”，而是“让它在正确的边界里做得又快又稳”。\u003c/p>\n\u003cp>如果你愿意，下一步最值得做的事情不是继续研究产品介绍，而是直接拿你当前知识库里的一个主题，按这篇指南跑一遍：先给 Codex 读仓库，再让它提计划，最后让它改一篇文档并给出验证结果。\u003c/p>\n"},"awards-catalog":{"id":"awards-catalog","title":"奖项与荣誉清单（第一轮）","relativePath":"learn/reference/awards/awards-catalog.md","html":"\u003ch1>奖项与荣誉清单（第一轮）\u003c/h1>\n\u003cp>这是一份面向后续奖项浏览器插件的数据种子清单。\u003c/p>\n\u003cp>口径说明：\u003c/p>\n\u003cul>\n\u003cli>先按“中国大陆 + 国际主流奖项”整理，不含大量地方奖、商业奖、一次性活动奖。\u003c/li>\n\u003cli>先收“奖项/荣誉本体”，后续再逐个补起源、介绍、历年获奖者/作品。\u003c/li>\n\u003cli>这是第一轮目录，不是最终穷尽版；目标是先把主干搭稳。\u003c/li>\n\u003cli>查证日期：2026-07-26。\u003c/li>\n\u003c/ul>\n\u003ch2>国际奖项与荣誉\u003c/h2>\n\u003ch3>科学、数学与技术\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>奖项/荣誉\u003c/th>\n\u003cth>领域\u003c/th>\n\u003cth>简介\u003c/th>\n\u003cth>官方来源\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Nobel Prize\u003c/td>\n\u003ctd>科学/文学/和平/经济学\u003c/td>\n\u003ctd>世界范围内最知名的综合性奖项系统之一，覆盖物理、化学、生理学或医学、文学、和平与经济学。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.nobelprize.org/prizes/\">Nobel Prize\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Fields Medal\u003c/td>\n\u003ctd>数学\u003c/td>\n\u003ctd>国际数学界最高荣誉之一，四年颁发一次，奖励杰出数学成就并兼顾未来潜力。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.mathunion.org/imu-awards/fields-medal\">IMU Fields Medal\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Abel Prize\u003c/td>\n\u003ctd>数学\u003c/td>\n\u003ctd>国际数学大奖，每年颁发，由挪威议会设立。\u003c/td>\n\u003ctd>\u003ca href=\"https://abelprize.no/page/about-abel-prize\">The Abel Prize\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ACM A. M. Turing Award\u003c/td>\n\u003ctd>计算机科学\u003c/td>\n\u003ctd>计算机领域最高荣誉之一，表彰对计算机科学作出持久影响的贡献。\u003c/td>\n\u003ctd>\u003ca href=\"https://awards.acm.org/\">ACM Awards\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Breakthrough Prize\u003c/td>\n\u003ctd>基础科学\u003c/td>\n\u003ctd>面向生命科学、基础物理和数学的高额国际奖项。\u003c/td>\n\u003ctd>\u003ca href=\"https://breakthroughprize.org/About\">Breakthrough Prize\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Lasker Awards\u003c/td>\n\u003ctd>医学\u003c/td>\n\u003ctd>关注基础医学、临床医学与公共服务的国际医学奖项体系。\u003c/td>\n\u003ctd>\u003ca href=\"https://laskerfoundation.org/awards/about-the-awards/\">Lasker Foundation\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Kyoto Prize\u003c/td>\n\u003ctd>科学/技术/艺术哲学\u003c/td>\n\u003ctd>日本设立的国际奖项，覆盖先进技术、基础科学、艺术与哲学。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.kyotoprize.org/en/about\">Kyoto Prize\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>文学、新闻与出版\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>奖项/荣誉\u003c/th>\n\u003cth>领域\u003c/th>\n\u003cth>简介\u003c/th>\n\u003cth>官方来源\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Pulitzer Prize\u003c/td>\n\u003ctd>新闻/文学/音乐\u003c/td>\n\u003ctd>美国重要奖项，覆盖新闻报道、图书、戏剧和音乐等。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.pulitzer.org/\">Pulitzer Prizes\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Booker Prize\u003c/td>\n\u003ctd>文学\u003c/td>\n\u003ctd>英语世界最具影响力的小说奖之一。\u003c/td>\n\u003ctd>\u003ca href=\"https://thebookerprizes.com/about-us\">Booker Prize Foundation\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>影视、音乐与戏剧\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>奖项/荣誉\u003c/th>\n\u003cth>领域\u003c/th>\n\u003cth>简介\u003c/th>\n\u003cth>官方来源\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Academy Awards (Oscars)\u003c/td>\n\u003ctd>电影\u003c/td>\n\u003ctd>全球最知名的电影奖项体系之一。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.oscars.org/about\">Oscars About\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Governors Awards\u003c/td>\n\u003ctd>电影荣誉\u003c/td>\n\u003ctd>奥斯卡体系中的荣誉奖，包含 Honorary Award、Jean Hersholt Humanitarian Award、Irving G. Thalberg Memorial Award。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.oscars.org/governors/about\">Governors Awards\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>BAFTA Awards\u003c/td>\n\u003ctd>电影/游戏/电视\u003c/td>\n\u003ctd>英国电影电视艺术学院主办的综合性屏幕类奖项。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.bafta.org/about/\">BAFTA About\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Grammy Awards\u003c/td>\n\u003ctd>音乐\u003c/td>\n\u003ctd>录音艺术与科学领域的权威音乐奖项体系。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.grammy.com/about/\">GRAMMY About\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Emmy Awards\u003c/td>\n\u003ctd>电视\u003c/td>\n\u003ctd>美国电视艺术与科学领域的重要奖项。\u003c/td>\n\u003ctd>\u003ca href=\"https://theemmys.tv/about/\">The Emmys About\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tony Awards\u003c/td>\n\u003ctd>戏剧\u003c/td>\n\u003ctd>百老汇戏剧界的核心奖项。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.tonyawards.com/about/administration/\">Tony Awards Administration\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>建筑与设计\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>奖项/荣誉\u003c/th>\n\u003cth>领域\u003c/th>\n\u003cth>简介\u003c/th>\n\u003cth>官方来源\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Pritzker Architecture Prize\u003c/td>\n\u003ctd>建筑\u003c/td>\n\u003ctd>国际建筑界最具声望的奖项之一。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.pritzkerprize.com/about\">Pritzker Prize\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2>中国大陆奖项与荣誉\u003c/h2>\n\u003ch3>国家科技奖\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>奖项/荣誉\u003c/th>\n\u003cth>领域\u003c/th>\n\u003cth>简介\u003c/th>\n\u003cth>官方来源\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>国家最高科学技术奖\u003c/td>\n\u003ctd>科技\u003c/td>\n\u003ctd>中国国家科技奖励体系中的最高荣誉。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.nosta.gov.cn/pc/zh/gjkjjl/index.shtml\">国家科技奖励工作办公室\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>国家自然科学奖\u003c/td>\n\u003ctd>科技\u003c/td>\n\u003ctd>奖励自然科学研究和基础理论创新。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.nosta.gov.cn/pc/zh/gjkjjl/index.shtml\">国家科技奖励工作办公室\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>国家技术发明奖\u003c/td>\n\u003ctd>科技\u003c/td>\n\u003ctd>奖励技术发明及其转化应用。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.nosta.gov.cn/pc/zh/gjkjjl/index.shtml\">国家科技奖励工作办公室\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>国家科学技术进步奖\u003c/td>\n\u003ctd>科技\u003c/td>\n\u003ctd>奖励科技成果应用推广及产业/社会效益。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.nosta.gov.cn/pc/zh/gjkjjl/gjkxjsjbj/index.shtml\">国家科技奖励工作办公室\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>国际科学技术合作奖\u003c/td>\n\u003ctd>科技\u003c/td>\n\u003ctd>奖励对中国科学技术事业作出重要贡献的外国人或组织。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.most.gov.cn/xxgk/xinxifenlei/fdzdgknr/gjkjjl/gjkjjlsj/\">科技部国家科技奖励\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>文学奖\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>奖项/荣誉\u003c/th>\n\u003cth>领域\u003c/th>\n\u003cth>简介\u003c/th>\n\u003cth>官方来源\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>茅盾文学奖\u003c/td>\n\u003ctd>文学\u003c/td>\n\u003ctd>中国最重要的长篇小说奖之一。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.chinawriter.com.cn/z/maodunwenxuejiang/index.shtml\">中国作家网-茅盾文学奖\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>鲁迅文学奖\u003c/td>\n\u003ctd>文学\u003c/td>\n\u003ctd>中国重要的文学大奖，覆盖中篇、短篇、报告文学、诗歌、散文杂文、文学理论评论与翻译等。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.chinawriter.com.cn/z/luxunwenxuejiang/index.shtml\">中国作家网-鲁迅文学奖\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>新闻与出版\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>奖项/荣誉\u003c/th>\n\u003cth>领域\u003c/th>\n\u003cth>简介\u003c/th>\n\u003cth>官方来源\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>中国新闻奖\u003c/td>\n\u003ctd>新闻\u003c/td>\n\u003ctd>中国优秀新闻作品最高奖。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.news.cn/ci/2019-05/15/c_138060504.htm\">中国新闻奖简介\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>长江韬奋奖\u003c/td>\n\u003ctd>新闻\u003c/td>\n\u003ctd>中国优秀新闻工作者最高奖。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.zgjx.cn/20260407/3b59a8284b704d0dbbd795bbfd1df3ca/c.html\">长江韬奋奖评选办法\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中国出版政府奖\u003c/td>\n\u003ctd>出版\u003c/td>\n\u003ctd>中国出版领域的重要政府奖项。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.nppa.gov.cn/xxfb/tzgs/202505/t20250509_894670.html\">国家新闻出版署\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>电影、电视与舞台艺术\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>奖项/荣誉\u003c/th>\n\u003cth>领域\u003c/th>\n\u003cth>简介\u003c/th>\n\u003cth>官方来源\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>中国电影华表奖\u003c/td>\n\u003ctd>电影\u003c/td>\n\u003ctd>中国电影政府奖，表彰电影创作与行业贡献。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.cflac.org.cn/new_ys/dy/hd/202305/t20230525_1280358.html\">中国文艺网-华表奖\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中国电影金鸡奖\u003c/td>\n\u003ctd>电影\u003c/td>\n\u003ctd>中国电影界的核心专业奖项之一。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.cflac.org.cn/Nwypj/\">中国文联文艺评奖\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>大众电影百花奖\u003c/td>\n\u003ctd>电影\u003c/td>\n\u003ctd>以大众投票为特色的重要电影奖项。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.cflac.org.cn/wywzt/dywn/dyj/201110/t20111027_14725.htm\">中国文艺网-百花奖\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中国戏剧奖\u003c/td>\n\u003ctd>戏剧\u003c/td>\n\u003ctd>中国戏剧界的重要奖项体系，含梅花表演奖、曹禺剧本奖等。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.cflac.org.cn/Nwypj/\">中国文联文艺评奖\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中国音乐金钟奖\u003c/td>\n\u003ctd>音乐\u003c/td>\n\u003ctd>中国音乐界重要综合性奖项。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.cflac.org.cn/Nwypj/\">中国文联文艺评奖\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中国美术奖\u003c/td>\n\u003ctd>美术\u003c/td>\n\u003ctd>中国美术界的重要奖项。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.cflac.org.cn/Nwypj/Njxgl/Nzgmsj/\">中国美术奖规则\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中国曲艺牡丹奖\u003c/td>\n\u003ctd>曲艺\u003c/td>\n\u003ctd>中国曲艺界重要奖项。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.cflac.org.cn/Nwypj/\">中国文联文艺评奖\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中国舞蹈荷花奖\u003c/td>\n\u003ctd>舞蹈\u003c/td>\n\u003ctd>中国舞蹈界重要奖项。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.cflac.org.cn/Nwypj/\">中国文联文艺评奖\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中国民间文艺山花奖\u003c/td>\n\u003ctd>民间文艺\u003c/td>\n\u003ctd>中国民间文艺领域重要奖项。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.cflac.org.cn/Nwypj/\">中国文联文艺评奖\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中国摄影金像奖\u003c/td>\n\u003ctd>摄影\u003c/td>\n\u003ctd>中国摄影界重要奖项。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.cflac.org.cn/Nwypj/\">中国文联文艺评奖\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中国书法兰亭奖\u003c/td>\n\u003ctd>书法\u003c/td>\n\u003ctd>中国书法界重要奖项。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.cflac.org.cn/Nwypj/\">中国文联文艺评奖\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中国杂技金菊奖\u003c/td>\n\u003ctd>杂技\u003c/td>\n\u003ctd>中国杂技界重要奖项。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.cflac.org.cn/Nwypj/\">中国文联文艺评奖\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中国电视金鹰奖\u003c/td>\n\u003ctd>电视\u003c/td>\n\u003ctd>中国电视艺术的重要奖项。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.cflac.org.cn/Nwypj/\">中国文联文艺评奖\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>国家荣誉与综合表彰\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>奖项/荣誉\u003c/th>\n\u003cth>领域\u003c/th>\n\u003cth>简介\u003c/th>\n\u003cth>官方来源\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>共和国勋章\u003c/td>\n\u003ctd>国家荣誉\u003c/td>\n\u003ctd>中华人民共和国国家最高荣誉之一。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.npc.gov.cn/npc/c2/c30834/201909/t20190917_300775.html\">国家勋章和国家荣誉称号制度\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>友谊勋章\u003c/td>\n\u003ctd>国家荣誉\u003c/td>\n\u003ctd>授予对中国建设和发展作出贡献的外国人士。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.npc.gov.cn/npc/c2/c30834/201909/t20190917_300775.html\">国家勋章和国家荣誉称号制度\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>国家荣誉称号\u003c/td>\n\u003ctd>国家荣誉\u003c/td>\n\u003ctd>法定国家最高荣誉称号体系，包含人民科学家、人民教育家等。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.npc.gov.cn/npc/c2/c30834/201909/t20190917_300775.html\">国家勋章和国家荣誉称号制度\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>七一勋章\u003c/td>\n\u003ctd>党内荣誉\u003c/td>\n\u003ctd>党内最高荣誉之一，表彰长期为党和人民作出突出贡献的党员。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.mod.gov.cn/gfbw/qwfb/16471023.html\">中共中央关于授予“七一勋章”的决定\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>时代楷模\u003c/td>\n\u003ctd>先进典型荣誉\u003c/td>\n\u003ctd>由中宣部发布的先进典型荣誉称号。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.moe.gov.cn/jyb_xwfb/s6052/moe_838/202109/t20210930_568400.html\">中宣部关于授予刘永坦同志“时代楷模”称号的决定\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>全国劳动模范和先进工作者\u003c/td>\n\u003ctd>劳动荣誉\u003c/td>\n\u003ctd>表彰各行各业的先进劳动者和先进工作者。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.mee.gov.cn/zcwj/zyygwj/202504/t20250429_1118567.shtml\">中共中央 国务院决定\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>全国道德模范\u003c/td>\n\u003ctd>道德荣誉\u003c/td>\n\u003ctd>表彰在社会公德、职业道德、家庭美德、个人品德等方面表现突出的典型。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.nhc.gov.cn/xcs/ddmf/new_list.shtml\">全国道德模范\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>国家荣誉称号的官方九类名称\u003c/h3>\n\u003cp>国家荣誉称号不是单一称号，而是一组法定名称。首批公开体系中的九类名称包括：\u003c/p>\n\u003cul>\n\u003cli>人民科学家\u003c/li>\n\u003cli>人民教育家\u003c/li>\n\u003cli>人民艺术家\u003c/li>\n\u003cli>人民英雄\u003c/li>\n\u003cli>人民楷模\u003c/li>\n\u003cli>民族团结杰出贡献者\u003c/li>\n\u003cli>“一国两制”杰出贡献者\u003c/li>\n\u003cli>外交工作杰出贡献者\u003c/li>\n\u003cli>文物保护杰出贡献者\u003c/li>\n\u003c/ul>\n\u003cp>来源： \u003ca href=\"https://www.npc.gov.cn/npc/c2/c30834/201909/t20190917_300775.html\">中国人大网说明\u003c/a>\u003c/p>\n\u003ch2>还可以继续扩展的方向\u003c/h2>\n\u003ch2>第二轮补充：更多主干奖项与荣誉\u003c/h2>\n\u003ch3>国际科学、数学与技术\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>奖项/荣誉\u003c/th>\n\u003cth>领域\u003c/th>\n\u003cth>简介\u003c/th>\n\u003cth>官方来源\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Wolf Prize\u003c/td>\n\u003ctd>科学/医学/艺术\u003c/td>\n\u003ctd>覆盖科学、医学和艺术的国际大奖。\u003c/td>\n\u003ctd>\u003ca href=\"https://wolffund.org.il/the-wolf-prize/\">Wolf Prize\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Shaw Prize\u003c/td>\n\u003ctd>科学/医学/数学\u003c/td>\n\u003ctd>聚焦天文学、生命科学与医学、数学科学的国际奖项。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.shawprize.org/\">Shaw Prize\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Kavli Prize\u003c/td>\n\u003ctd>天体物理/纳米科学/神经科学\u003c/td>\n\u003ctd>表彰在三大前沿科学领域取得突破的研究者。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.kavliprize.org/about\">Kavli Prize\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Japan Prize\u003c/td>\n\u003ctd>科学技术\u003c/td>\n\u003ctd>奖励对科学技术进步和人类福祉作出贡献的研究者。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.japanprize.jp/en/prize.html\">Japan Prize\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Crafoord Prize\u003c/td>\n\u003ctd>科学\u003c/td>\n\u003ctd>由瑞典皇家科学院颁发，覆盖若干基础学科与天文学、数学等轮转领域。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.crafoordprize.se/\">Crafoord Prize\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>IEEE Medal of Honor\u003c/td>\n\u003ctd>工程/电气与计算机\u003c/td>\n\u003ctd>IEEE 体系中最高级别荣誉之一。\u003c/td>\n\u003ctd>\u003ca href=\"https://corporate-awards.ieee.org/medal-of-honor/\">IEEE Medal of Honor\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Millennium Technology Prize\u003c/td>\n\u003ctd>技术创新\u003c/td>\n\u003ctd>国际科技创新奖，聚焦改变世界的技术突破。\u003c/td>\n\u003ctd>\u003ca href=\"https://millenniumprize.org/the-prize/\">Millennium Technology Prize\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>国际和平、环境与人权\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>奖项/荣誉\u003c/th>\n\u003cth>领域\u003c/th>\n\u003cth>简介\u003c/th>\n\u003cth>官方来源\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Right Livelihood Award\u003c/td>\n\u003ctd>环境/人权/和平\u003c/td>\n\u003ctd>常被称为“另类诺贝尔奖”，表彰面向社会变革的实践者。\u003c/td>\n\u003ctd>\u003ca href=\"https://rightlivelihood.org/the-prize/\">Right Livelihood Award\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Earthshot Prize\u003c/td>\n\u003ctd>环境\u003c/td>\n\u003ctd>聚焦可扩展、可复制的环境修复方案。\u003c/td>\n\u003ctd>\u003ca href=\"https://earthshotprize.org/the-prize/about/\">The Earthshot Prize\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Goldman Environmental Prize\u003c/td>\n\u003ctd>环境\u003c/td>\n\u003ctd>表彰保护自然环境的基层行动者。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.goldmanprize.org/about/\">Goldman Prize\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sakharov Prize for Freedom of Thought\u003c/td>\n\u003ctd>人权\u003c/td>\n\u003ctd>欧洲议会授予的人权与言论自由荣誉。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.europarl.europa.eu/sakharovprize/en/home/\">Sakharov Prize\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>国际文学、科幻与出版\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>奖项/荣誉\u003c/th>\n\u003cth>领域\u003c/th>\n\u003cth>简介\u003c/th>\n\u003cth>官方来源\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>National Book Awards\u003c/td>\n\u003ctd>文学\u003c/td>\n\u003ctd>美国国家图书奖，覆盖小说、非虚构、诗歌、翻译文学和青少年文学。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.nationalbook.org/national-book-awards/\">National Book Awards\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hugo Awards\u003c/td>\n\u003ctd>科幻文学\u003c/td>\n\u003ctd>世界科幻领域最具影响力的奖项之一。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.thehugoawards.org/about/\">The Hugo Award\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Nebula Awards\u003c/td>\n\u003ctd>科幻/奇幻文学\u003c/td>\n\u003ctd>SFWA 颁发的科幻与奇幻文学奖项体系。\u003c/td>\n\u003ctd>\u003ca href=\"https://nebulas.sfwa.org/about-the-nebulas/\">The Nebulas\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>国际影视、戏剧与表演\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>奖项/荣誉\u003c/th>\n\u003cth>领域\u003c/th>\n\u003cth>简介\u003c/th>\n\u003cth>官方来源\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Golden Globes\u003c/td>\n\u003ctd>影视\u003c/td>\n\u003ctd>电影、电视与播客领域的重要奖项。\u003c/td>\n\u003ctd>\u003ca href=\"https://goldenglobes.com/\">Golden Globes\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Palme d’Or\u003c/td>\n\u003ctd>电影\u003c/td>\n\u003ctd>戛纳国际电影节最佳影片奖。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.festival-cannes.com/en/the-festival/the-palme-d-or/\">Festival de Cannes - Palme d&#39;Or\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Golden Lion\u003c/td>\n\u003ctd>电影/艺术/舞蹈/音乐/戏剧\u003c/td>\n\u003ctd>威尼斯双年展体系中的核心荣誉，电影、戏剧、舞蹈、音乐、艺术均有“金狮”奖。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.labiennale.org/en\">La Biennale di Venezia\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Golden Bear\u003c/td>\n\u003ctd>电影\u003c/td>\n\u003ctd>柏林国际电影节最高奖。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.berlinale.de/en/archive/awards-juries/awards.html/o%3Ddesc/p%3D1/rp%3D40\">Berlinale Awards\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>César Awards\u003c/td>\n\u003ctd>电影\u003c/td>\n\u003ctd>法国电影学院体系中的国家级电影奖项。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.academie-cinema.org/lacademie/presentation/\">Académie des César\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Olivier Awards\u003c/td>\n\u003ctd>戏剧\u003c/td>\n\u003ctd>伦敦西区戏剧界的重要荣誉。\u003c/td>\n\u003ctd>\u003ca href=\"https://vote.olivierawards.com/\">Olivier Awards Voting Portal\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>国际设计与建筑\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>奖项/荣誉\u003c/th>\n\u003cth>领域\u003c/th>\n\u003cth>简介\u003c/th>\n\u003cth>官方来源\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Pritzker Architecture Prize\u003c/td>\n\u003ctd>建筑\u003c/td>\n\u003ctd>国际建筑界最具声望的奖项之一。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.pritzkerprize.com/about\">Pritzker Prize\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Aga Khan Award for Architecture\u003c/td>\n\u003ctd>建筑\u003c/td>\n\u003ctd>关注伊斯兰世界及相关地区建筑与环境质量。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.akdn.org/our-agencies/aga-khan-trust-culture/aga-khan-award-architecture\">Aga Khan Award for Architecture\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RIBA Stirling Prize\u003c/td>\n\u003ctd>建筑\u003c/td>\n\u003ctd>英国皇家建筑师学会最高建筑奖项之一。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.architecture.com/awards-and-competitions-landing-page/awards/stirling-prize\">RIBA Stirling Prize\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>World Architecture Festival Awards\u003c/td>\n\u003ctd>建筑\u003c/td>\n\u003ctd>以现场评审闻名的国际建筑奖项。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.worldarchitecturefestival.com/WAF2026/en/page/awards-page\">WAF Awards\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Red Dot Design Award\u003c/td>\n\u003ctd>设计\u003c/td>\n\u003ctd>国际设计领域知名奖项，分产品、品牌传播和概念设计。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.red-dot.org/award\">Red Dot Award\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>iF DESIGN AWARD\u003c/td>\n\u003ctd>设计\u003c/td>\n\u003ctd>国际设计竞赛与认证体系。\u003c/td>\n\u003ctd>\u003ca href=\"https://ifdesign.com/en/\">iF Design\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>中国大陆科技与教育\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>奖项/荣誉\u003c/th>\n\u003cth>领域\u003c/th>\n\u003cth>简介\u003c/th>\n\u003cth>官方来源\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>中国青年科学家奖（原中国青年科技奖）\u003c/td>\n\u003ctd>科技\u003c/td>\n\u003ctd>2025 年起更名，面向青年科技人才的重要奖项。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.cast.org.cn/rc2/bzytj/zgqnkxjj/art/2025/art_a1263858caa445caaea654b623849c29.html\">中国青年科学家奖\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中国青年女科学家奖\u003c/td>\n\u003ctd>科技\u003c/td>\n\u003ctd>面向青年女性科技工作者的重要荣誉。\u003c/td>\n\u003ctd>\u003ca href=\"https://rczx.cast.org.cn/jljj/jxjs/art/2021/art_a1b0aa2af0d745aa8674257580792285.html\">中国青年女科学家奖\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>全国创新争先奖\u003c/td>\n\u003ctd>科技\u003c/td>\n\u003ctd>表彰基础研究、工程攻关、成果转化、社会服务等领域的突出贡献者。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.cast.org.cn/qjkx/KXJX/index.html\">全国创新争先奖介绍\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>最美科技工作者\u003c/td>\n\u003ctd>科技\u003c/td>\n\u003ctd>中央宣传部、中国科协发布的科技工作者先进典型。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.cast.org.cn/xw/MTBD/art/2026/art_a9f6c410d58a4680a1f189178aa291fc.html\">最美科技工作者发布\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>国家教学成果奖\u003c/td>\n\u003ctd>教育\u003c/td>\n\u003ctd>教育教学研究和实践领域最高奖。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.moe.gov.cn/jyb_sjzl/sjzl_zcfg/zcfg_jyxzfg/202204/t20220422_620499.html\">教学成果奖励条例\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>全国优秀教师 / 全国模范教师 / 全国优秀教育工作者\u003c/td>\n\u003ctd>教育\u003c/td>\n\u003ctd>教育系统的重要荣誉称号集合。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.moe.gov.cn/jyb_xxgk/xxgk/neirong/fenlei/sxml_jsgz/jsgz_sdjs/sdjs_yxjs/\">教育部相关表彰文件汇总\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中国专利奖\u003c/td>\n\u003ctd>知识产权/创新\u003c/td>\n\u003ctd>国家知识产权局与世界知识产权组织共同开展的专利奖。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.cnipa.gov.cn/col/col41/index.html\">中国专利奖专栏\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>中国大陆医疗与健康\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>奖项/荣誉\u003c/th>\n\u003cth>领域\u003c/th>\n\u003cth>简介\u003c/th>\n\u003cth>官方来源\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>中国医师奖\u003c/td>\n\u003ctd>医疗\u003c/td>\n\u003ctd>医师行业的重要荣誉。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.nhc.gov.cn/wjw/zsdw/201406/9b833c27744548eea29c700b6d48a857.shtml\">中国医师奖颁奖大会\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>白求恩奖章\u003c/td>\n\u003ctd>医疗\u003c/td>\n\u003ctd>全国卫生健康系统的重要荣誉。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.nhc.gov.cn/renshi/c100028/202503/5b419f06e83843edad5e6958b2746869.shtml\">白求恩奖章获得者决定\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中国好医生 中国好护士\u003c/td>\n\u003ctd>医疗\u003c/td>\n\u003ctd>国家卫健委长期展示和宣传的医疗卫生先进典型。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.nhc.gov.cn/xcs/2026dyp/202603/a3da853e4b934c5db96a30d29bd8c761.shtml\">中国好医生好护士\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>中国大陆广播电视与传媒\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>奖项/荣誉\u003c/th>\n\u003cth>领域\u003c/th>\n\u003cth>简介\u003c/th>\n\u003cth>官方来源\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>中国广播电视大奖·中国广播电视节目奖\u003c/td>\n\u003ctd>广电\u003c/td>\n\u003ctd>国家广播电视体系内的重要节目奖。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.nrta.gov.cn/art/2026/4/23/art_113_73130.html\">国家广电总局评奖通知\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>全国电视文艺“星光奖”\u003c/td>\n\u003ctd>电视文艺\u003c/td>\n\u003ctd>中国电视文艺节目领域的重要奖项。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.nrta.gov.cn/art/2026/2/2/art_113_72384.html\">星光奖评选通知\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中国播音主持“金声奖”\u003c/td>\n\u003ctd>广播主持\u003c/td>\n\u003ctd>播音主持专业的重要奖项。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.nrta.gov.cn/art/2025/3/25/art_113_70369.html?xxgkhide=1\">金声奖评选通知\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>中国大陆青年、劳动与综合荣誉\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>奖项/荣誉\u003c/th>\n\u003cth>领域\u003c/th>\n\u003cth>简介\u003c/th>\n\u003cth>官方来源\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>中国青年五四奖章\u003c/td>\n\u003ctd>青年荣誉\u003c/td>\n\u003ctd>表彰优秀青年个人和集体的重要荣誉。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.news.cn/politics/20260510/7ef95cd3777c49d6afee097ad0d81ff6/c.html\">新华社 / 团中央决定\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>新时代青年先锋奖\u003c/td>\n\u003ctd>青年荣誉\u003c/td>\n\u003ctd>与中国青年五四奖章并行的新时代青年先进典型奖项。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.bjyouth.gov.cn/news/workDynamics/799222396035141.html\">2026年度中国青年五四奖章暨新时代青年先锋奖\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>共和国勋章\u003c/td>\n\u003ctd>国家荣誉\u003c/td>\n\u003ctd>中华人民共和国国家最高荣誉之一。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.npc.gov.cn/npc/c2/c30834/201909/t20190917_300775.html\">国家勋章和国家荣誉称号制度\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>友谊勋章\u003c/td>\n\u003ctd>国家荣誉\u003c/td>\n\u003ctd>授予对中国建设和发展作出贡献的外国人士。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.npc.gov.cn/npc/c2/c30834/201909/t20190917_300775.html\">国家勋章和国家荣誉称号制度\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>七一勋章\u003c/td>\n\u003ctd>党内荣誉\u003c/td>\n\u003ctd>党内最高荣誉之一。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.mod.gov.cn/gfbw/qwfb/16471023.html\">中共中央关于授予“七一勋章”的决定\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>时代楷模\u003c/td>\n\u003ctd>先进典型荣誉\u003c/td>\n\u003ctd>由中宣部发布的先进典型荣誉称号。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.moe.gov.cn/jyb_xwfb/s6052/moe_838/202109/t20210930_568400.html\">中宣部关于授予刘永坦同志“时代楷模”称号的决定\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>全国劳动模范和先进工作者\u003c/td>\n\u003ctd>劳动荣誉\u003c/td>\n\u003ctd>表彰各行各业的先进劳动者和先进工作者。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.mee.gov.cn/zcwj/zyygwj/202504/t20250429_1118567.shtml\">中共中央 国务院决定\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>全国道德模范\u003c/td>\n\u003ctd>道德荣誉\u003c/td>\n\u003ctd>表彰社会公德、职业道德、家庭美德、个人品德方面的先进典型。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.nhc.gov.cn/xcs/ddmf/new_list.shtml\">全国道德模范\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>中国大陆工程与建筑\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>奖项/荣誉\u003c/th>\n\u003cth>领域\u003c/th>\n\u003cth>简介\u003c/th>\n\u003cth>官方来源\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>中国建设工程鲁班奖（国家优质工程）\u003c/td>\n\u003ctd>建筑工程\u003c/td>\n\u003ctd>中国建筑行业最高质量荣誉之一。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.nra.gov.cn/xxgk/gkml/ztjg/jgxx/gkgc/202204/t20220405_290300.shtml\">鲁班奖通报\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中国土木工程詹天佑奖\u003c/td>\n\u003ctd>土木工程\u003c/td>\n\u003ctd>中国土木工程领域的重要科技奖项。\u003c/td>\n\u003ctd>\u003ca href=\"https://ggzy.qingdao.gov.cn/PortalQDManage/ShareResources/CorpRewardList?corpGuid=6bb18f57-deb8-4e4f-8aa8-c61d97eabc7f&pageIndex=2\">企业获奖信息示例\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>中国大陆质量、技能与劳动荣誉\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>奖项/荣誉\u003c/th>\n\u003cth>领域\u003c/th>\n\u003cth>简介\u003c/th>\n\u003cth>官方来源\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>中国质量奖\u003c/td>\n\u003ctd>质量管理\u003c/td>\n\u003ctd>国家在质量领域授予组织和个人的最高荣誉。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/fgs/art/2023/art_73e66a07e1c24744bd79bd4f3629f70b.html\">中国质量奖管理办法\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中华技能大奖\u003c/td>\n\u003ctd>技能人才\u003c/td>\n\u003ctd>全国优秀技术技能人才的国家级最高褒奖之一。\u003c/td>\n\u003ctd>\u003ca href=\"https://chinajob.mohrss.gov.cn/ywpd/pxjd/rmzt/gjnrcpxbz/\">高技能人才评选表彰\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>全国技术能手\u003c/td>\n\u003ctd>技能人才\u003c/td>\n\u003ctd>对优秀技术技能人才的国家级表彰称号。\u003c/td>\n\u003ctd>\u003ca href=\"https://chinajob.mohrss.gov.cn/c/2013-09-23/232975.shtml\">中华技能大奖和全国技术能手评选表彰管理办法\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>全国五一劳动奖状 / 全国五一劳动奖章 / 全国工人先锋号\u003c/td>\n\u003ctd>劳动荣誉\u003c/td>\n\u003ctd>全国总工会的重要劳动荣誉体系，分别授予单位、个人和集体。\u003c/td>\n\u003ctd>\u003ca href=\"https://www.zyshgzb.gov.cn/n1/2026/0130/c461706-40655890.html\">全国五一劳动奖评选启动\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>中国大陆对外交流与外国专家荣誉\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>奖项/荣誉\u003c/th>\n\u003cth>领域\u003c/th>\n\u003cth>简介\u003c/th>\n\u003cth>官方来源\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>中国政府友谊奖\u003c/td>\n\u003ctd>外国专家 / 对外合作\u003c/td>\n\u003ctd>授予对中国现代化建设和中外交流合作作出突出贡献的外国专家。\u003c/td>\n\u003ctd>\u003ca href=\"https://most.gov.cn/xxgk/xinxifenlei/fdzdgknr/qtwj/qtwj2021/202104/t20210402_173854.html\">科技部中国政府友谊奖申报通知\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中国语言文化友谊奖\u003c/td>\n\u003ctd>汉语教学 / 文化传播\u003c/td>\n\u003ctd>授予在汉语教学、汉学研究和中国语言文化传播方面作出突出贡献的外国友人。\u003c/td>\n\u003c
