ocument-id="verification-code-registration-login">邮箱与手机号验证码认证：从一次性挑战到可撤销登录态</a></li></ul></div></li></ul></div></li></ul>

  <script>
    const knowledge = {"documents":{"vuex-pinia":{"id":"vuex-pinia","title":"Vue 状态管理演进：从 Vuex 到 Pinia","relativePath":"learn/frontend/vue/vuex-pinia.md","html":"\u003ch1>Vue 状态管理演进：从 Vuex 到 Pinia 的技术深度解析\u003c/h1>\n\u003ch2>1. 核心结论：同源不同构\u003c/h2>\n\u003cp>Vuex 和 Pinia 在\u003cstrong>底层原理\u003c/strong>上高度一致，但在\u003cstrong>架构设计\u003c/strong>和\u003cstrong>开发体验\u003c/strong>上存在本质差异。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>相同点（底层）\u003c/strong>：\u003cul>\n\u003cli>\u003cstrong>响应式驱动\u003c/strong>：均依赖 Vue 的响应式系统（Vue 2 的 \u003ccode>Object.defineProperty\u003c/code> / Vue 3 的 \u003ccode>Proxy\u003c/code>）实现状态变更的视图自动更新。\u003c/li>\n\u003cli>\u003cstrong>依赖注入\u003c/strong>：均通过 \u003ccode>app.use()\u003c/code> 利用 Vue 的 \u003ccode>provide/inject\u003c/code> 机制，将 Store 实例注入全局组件树。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>不同点（上层）\u003c/strong>：\u003cul>\n\u003cli>\u003cstrong>架构模式\u003c/strong>：Vuex 是\u003cstrong>单一状态树 + 嵌套模块\u003c/strong>；Pinia 是\u003cstrong>扁平化 Map + 独立 Store\u003c/strong>。\u003c/li>\n\u003cli>\u003cstrong>变更流程\u003c/strong>：Vuex 强制 \u003cstrong>State -&gt; Mutation -&gt; Action\u003c/strong> 分离；Pinia 允许 \u003cstrong>Action 直接修改 State\u003c/strong>。\u003c/li>\n\u003cli>\u003cstrong>类型支持\u003c/strong>：Vuex 对 TS 支持繁琐；Pinia 实现\u003cstrong>原生类型推导\u003c/strong>。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch2>2. 底层机制：依赖注入与单例容器\u003c/h2>\n\u003cp>理解两者如何“串联”的关键，在于 \u003ccode>app.use()\u003c/code> 和内部存储结构。\u003c/p>\n\u003ch3>2.1 注入机制 (\u003ccode>app.use\u003c/code>)\u003c/h3>\n\u003cp>当执行 \u003ccode>app.use(pinia)\u003c/code> 或 \u003ccode>app.use(store)\u003c/code> 时，框架内部执行了以下操作：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>创建实例\u003c/strong>：初始化唯一的 Pinia 或 Vuex Store 实例。\u003c/li>\n\u003cli>\u003cstrong>全局广播\u003c/strong>：调用 \u003ccode>app.provide(&#39;store-key&#39;, instance)\u003c/code>。\u003c/li>\n\u003cli>\u003cstrong>组件获取\u003c/strong>：组件内部通过 \u003ccode>inject(&#39;store-key&#39;)\u003c/code> 或挂载到 \u003ccode>globalProperties\u003c/code> (\u003ccode>this.$store\u003c/code>) 获取该实例。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>结论\u003c/strong>：无论 Vuex 还是 Pinia，应用中都只存在\u003cstrong>一个\u003c/strong>根管理器实例。\u003c/p>\n\u003ch3>2.2 存储结构差异\u003c/h3>\n\u003cp>这是两者最核心的技术分水岭。\u003c/p>\n\u003cul>\n\u003cli>\u003cp>\u003cstrong>Vuex (树形结构)\u003c/strong>：\u003c/p>\n\u003cul>\n\u003cli>所有状态存储在单一的 \u003ccode>state\u003c/code> 对象中。\u003c/li>\n\u003cli>模块通过 \u003ccode>modules\u003c/code> 选项嵌套注册。\u003c/li>\n\u003cli>\u003cstrong>访问路径\u003c/strong>：\u003ccode>store.state.moduleA.moduleB.value\u003c/code>。\u003c/li>\n\u003cli>\u003cstrong>缺点\u003c/strong>：路径深、命名空间易冲突、需手动配置 \u003ccode>namespaced: true\u003c/code>。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Pinia (扁平 Map 结构)\u003c/strong>：\u003c/p>\n\u003cul>\n\u003cli>内部维护一个 \u003ccode>pinia._s\u003c/code> (Map 对象)。\u003c/li>\n\u003cli>每个 Store 通过唯一的 \u003ccode>id\u003c/code> 作为 Key 存入 Map。\u003c/li>\n\u003cli>\u003cstrong>访问路径\u003c/strong>：直接调用 \u003ccode>useStore()\u003c/code> 函数获取实例。\u003c/li>\n\u003cli>\u003cstrong>优点\u003c/strong>：天然隔离、无嵌套、按需加载（懒注册）。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003cblockquote>\n\u003cp>\u003cstrong>技术细节\u003c/strong>：当你调用 \u003ccode>useUserStore()\u003c/code> 时，Pinia 会检查 \u003ccode>pinia._s\u003c/code> 中是否存在 \u003ccode>id: &#39;user&#39;\u003c/code>。若不存在，则根据 \u003ccode>defineStore\u003c/code> 的定义创建实例并执行 \u003ccode>pinia._s.set(&#39;user&#39;, instance)\u003c/code>；若存在，直接返回缓存实例。\u003cstrong>重复 ID 会直接抛出异常，防止状态静默覆盖。\u003c/strong>\u003c/p>\n\u003c/blockquote>\n\u003chr>\n\u003ch2>3. 核心变革：API 设计与逻辑封装\u003c/h2>\n\u003cp>Pinia 针对 Vuex 的痛点进行了三项关键重构。\u003c/p>\n\u003ch3>3.1 移除 Mutations (去仪式化)\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Vuex\u003c/strong>：严格区分同步 (\u003ccode>mutations\u003c/code>) 和异步 (\u003ccode>actions\u003c/code>)。修改状态必须 \u003ccode>commit\u003c/code>。\u003cul>\n\u003cli>\u003cem>代价\u003c/em>：代码割裂，简单的同步修改也需要定义 mutation 类型和函数。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Pinia\u003c/strong>：移除 Mutations。\u003ccode>actions\u003c/code> 可直接修改 \u003ccode>state\u003c/code>。\u003cul>\n\u003cli>\u003cem>优势\u003c/em>：利用 Vue 3 Proxy 的特性，任何位置的赋值都能被追踪。逻辑内聚，异步/同步操作可在同一函数完成。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003ch3>3.2 模块化：从“嵌套”到“组合”\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Vuex\u003c/strong>：中心化注册。需在根 Store 显式导入并注册所有子模块。\u003c/li>\n\u003cli>\u003cstrong>Pinia\u003c/strong>：去中心化组合。每个 Store 是独立文件，通过 \u003ccode>import\u003c/code> 按需引入。Store 之间可互相调用，无层级限制。\u003c/li>\n\u003c/ul>\n\u003ch3>3.3 TypeScript 原生支持\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Vuex\u003c/strong>：类型推导困难，常需手动定义 \u003ccode>InjectionKey\u003c/code> 和复杂的泛型包裹。\u003c/li>\n\u003cli>\u003cstrong>Pinia\u003c/strong>：基于函数式 API (\u003ccode>defineStore\u003c/code>)，TS 可自动推导 \u003ccode>state\u003c/code>、\u003ccode>getters\u003c/code>、\u003ccode>actions\u003c/code> 的类型，无需额外声明文件。\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch2>4. 代码实战对比\u003c/h2>\n\u003cp>以“用户登录”场景为例，展示代码量的缩减与逻辑的内聚。\u003c/p>\n\u003ch3>Vuex 实现 (繁琐)\u003c/h3>\n\u003cpre>\u003ccode class=\"language-javascript\">// store/modules/user.js\nexport default {\n  namespaced: true,\n  state: () =&gt; ({ token: null, user: null }),\n  mutations: {\n    SET_TOKEN(state, token) { state.token = token; },\n    SET_USER(state, user) { state.user = user; }\n  },\n  actions: {\n    async login({ commit }, credentials) {\n      const res = await api.login(credentials);\n      commit(&#39;SET_TOKEN&#39;, res.token); // 必须 commit\n      commit(&#39;SET_USER&#39;, res.user);\n    }\n  }\n};\n\n// 组件调用\nthis.$store.dispatch(&#39;user/login&#39;, creds);\n\u003c/code>\u003c/pre>\n\u003ch3>Pinia 实现 (精简)\u003c/h3>\n\u003cpre>\u003ccode class=\"language-javascript\">// stores/user.js\nexport const useUserStore = defineStore(&#39;user&#39;, {\n  state: () =&gt; ({ token: null, user: null }),\n  actions: {\n    async login(credentials) {\n      const res = await api.login(credentials);\n      this.token = res.token; // 直接修改\n      this.user = res.user;\n    }\n  }\n});\n\n// 组件调用 (Setup 语法糖)\nconst userStore = useUserStore();\nawait userStore.login(creds);\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003ch2>5. 总结与建议\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth align=\"left\">维度\u003c/th>\n\u003cth align=\"left\">Vuex\u003c/th>\n\u003cth align=\"left\">Pinia\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd align=\"left\">\u003cstrong>适用场景\u003c/strong>\u003c/td>\n\u003ctd align=\"left\">Vue 2 项目维护、旧架构迁移\u003c/td>\n\u003ctd align=\"left\">\u003cstrong>Vue 3 新项目首选\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">\u003cstrong>状态结构\u003c/strong>\u003c/td>\n\u003ctd align=\"left\">单一树，嵌套模块\u003c/td>\n\u003ctd align=\"left\">\u003cstrong>扁平 Map，独立 Store\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">\u003cstrong>修改方式\u003c/strong>\u003c/td>\n\u003ctd align=\"left\">必须通过 Mutation\u003c/td>\n\u003ctd align=\"left\">\u003cstrong>Action 直接修改\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">\u003cstrong>TS 支持\u003c/strong>\u003c/td>\n\u003ctd align=\"left\">弱，需大量类型体操\u003c/td>\n\u003ctd align=\"left\">\u003cstrong>强，自动推导\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"left\">\u003cstrong>包体积\u003c/strong>\u003c/td>\n\u003ctd align=\"left\">~22kb\u003c/td>\n\u003ctd align=\"left\">\u003cstrong>~1kb\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>技术选型建议\u003c/strong>：\n对于所有基于 Vue 3 的新项目，\u003cstrong>强烈推荐直接使用 Pinia\u003c/strong>。它并非简单的“替代品”，而是利用 Vue 3 新特性（Composition API, Proxy, TS）对状态管理模式的一次现代化重构。它在保持响应式原理不变的前提下，极大地降低了样板代码，提升了逻辑的内聚性与开发效率。\u003c/p>\n"},"chrome-extension-architecture":{"id":"chrome-extension-architecture","title":"Chrome Extension：运行时模型、权限边界与架构取舍","relativePath":"learn/frontend/browser/chrome-extension-architecture.md","html":"\u003ch1>Chrome Extension：运行时模型、权限边界与架构取舍\u003c/h1>\n\u003cblockquote>\n\u003cp>查证基线：Manifest V3，资料核对于 2026-07-26。Chrome Extension API 持续演进，涉及最低版本的能力应以发布时的官方文档为准。\u003c/p>\n\u003c/blockquote>\n\u003ch2>核心判断\u003c/h2>\n\u003cp>Chrome 插件不是“获得了更多 API 的网页”，而是一个部署在浏览器内部的、由多个执行上下文组成的事件驱动系统：\u003c/p>\n\u003cul>\n\u003cli>content script 靠近页面，但处于低信任区；\u003c/li>\n\u003cli>service worker 持有主要权限，但生命周期短暂；\u003c/li>\n\u003cli>popup、side panel、options、DevTools page 等 UI 各有独立生命周期；\u003c/li>\n\u003cli>各上下文不能依赖共享内存，只能通过消息和持久化状态协作；\u003c/li>\n\u003cli>manifest 同时定义能力、攻击面、用户授权和商店审核边界。\u003c/li>\n\u003c/ul>\n\u003cp>因此，真正决定插件质量的通常不是 UI 框架，而是四个设计：\u003cstrong>权限是否最小化、消息是否协议化、状态是否可恢复、特权是否被隔离\u003c/strong>。\u003c/p>\n\u003cp>Manifest V3 把长期存活的 background page 改为按需唤醒的 service worker，并禁止执行远程托管代码。官方给出的目标是改善隐私、安全、性能以及用户对插件能力的控制。这不是简单的 API 升级，而是平台把扩展从“常驻且可动态改变的程序”推向“可审查、事件驱动、资源受约束的程序”。\u003ca href=\"https://developer.chrome.com/docs/extensions/develop/migrate/what-is-mv3\">Chrome：Manifest V3\u003c/a>\u003c/p>\n\u003ch2>一、先建立正确的运行时模型\u003c/h2>\n\u003cp>一个典型插件跨越页面、浏览器扩展进程和网络栈：\u003c/p>\n\u003cfigure class=\"diagram\">\u003csvg id=\"personal-learning-learn-frontend-browser-chrome-extension-architecture-md-1\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" class=\"flowchart\" style=\"max-width: 1322.02px; background-color: white;\" viewBox=\"0 0 1322.015625 258\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\">\u003cstyle>#personal-learning-learn-frontend-browser-chrome-extension-architecture-md-1{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#personal-learning-learn-frontend-browser-chrome-extension-architecture-md-1 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#personal-learning-learn-frontend-browser-chrome-extension-architecture-md-1 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear h=\"80\" height=\"24\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" class=\"labelBkg\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\">\u003cspan class=\"edgeLabel\">\u003cp>受权限约束\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003c/g>\u003cg class=\"nodes\">\u003cg class=\"node default\" id=\"personal-learning-learn-frontend-browser-chrome-extension-architecture-md-1-flowchart-Page-0\" data-look=\"classic\" transform=\"translate(94, 59)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-86\" y=\"-39\" width=\"172\" height=\"78\"/>\u003cg class=\"label\" style=\"\" transform=\"translate(-56, -24)\">\u003crect/>\u003cforeignObject width=\"112\" height=\"48\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\">\u003cspan class=\"nodeLabel\">\u003cp>网页主世界\u003cbr />不可信页面代码\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"node default\" id=\"personal-learning-learn-frontend-browser-chrome-extension-architecture-md-1-flowchart-CS-1\" data-look=\"classic\" transform=\"translate(473.984375, 59)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-81.765625\" y=\"-39\" width=\"163.53125\" height=\"78\"/>\u003cg class=\"label\" style=\"\" transform=\"translate(-51.765625, -24)\">\u003crect/>\u003cforeignObject width=\"103.53125\" height=\"48\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\">\u003cspan class=\"nodeLabel\">\u003cp>Content Script\u003cbr />页面适配器\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"node default\" id=\"personal-learning-learn-frontend-browser-chrome-extension-architecture-md-1-flowchart-SW-2\" data-look=\"classic\" transform=\"translate(803.984375, 129)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-86\" y=\"-39\" width=\"172\" height=\"78\"/>\u003cg class=\"label\" style=\"\" transform=\"translate(-56, -24)\">\u003crect/>\u003cforeignObject width=\"112\" height=\"48\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\">\u003cspan class=\"nodeLabel\">\u003cp>Service Worker\u003cbr />权限与协调中心\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"node default\" id=\"personal-learning-learn-frontend-browser-chrome-extension-architecture-md-1-flowchart-UI-3\" data-look=\"classic\" transform=\"translate(473.984375, 199)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-130\" y=\"-51\" width=\"260\" height=\"102\"/>\u003cg class=\"label\" style=\"\" transform=\"translate(-100, -36)\">\u003crect/>\u003cforeignObject width=\"200\" height=\"72\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;\">\u003cspan class=\"nodeLabel\">\u003cp>Popup / Side Panel / Options\u003cbr />交互界面\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"node default\" id=\"personal-learning-learn-frontend-browser-chrome-extension-architecture-md-1-flowchart-Store-4\" data-look=\"classic\" transform=\"translate(1184.015625, 59)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-130\" y=\"-51\" width=\"260\" height=\"102\"/>\u003cg class=\"label\" style=\"\" transform=\"translate(-100, -36)\">\u003crect/>\u003cforeignObject width=\"200\" height=\"72\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;\">\u003cspan class=\"nodeLabel\">\u003cp>chrome.storage / IndexedDB\u003cbr />持久状态\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"node default\" id=\"personal-learning-learn-frontend-browser-chrome-extension-architecture-md-1-flowchart-Net-5\" data-look=\"classic\" transform=\"translate(1184.015625, 199)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-130\" y=\"-39\" width=\"260\" height=\"78\"/>\u003cg class=\"label\" style=\"\" transform=\"translate(-100, -24)\">\u003crect/>\u003cforeignObject width=\"200\" height=\"48\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;\">\u003cspan class=\"nodeLabel\">\u003cp>Chrome API / 网络 / 外部服务\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003cdefs>\u003cfilter id=\"personal-learning-learn-frontend-browser-chrome-extension-architecture-md-1-drop-shadow\" height=\"130%\" width=\"130%\">\u003cfeDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"/>\u003c/filter>\u003c/defs>\u003cdefs>\u003cfilter id=\"personal-learning-learn-frontend-browser-chrome-extension-architecture-md-1-drop-shadow-small\" height=\"150%\" width=\"150%\">\u003cfeDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"/>\u003c/filter>\u003c/defs>\u003c/svg>\u003c/figure>\u003cp>这张图中最重要的不是组件名称，而是边界：\u003c/p>\n\u003col>\n\u003cli>网页不是你的进程，它可以随时导航、刷新、重写 DOM，也可能是恶意的。\u003c/li>\n\u003cli>content script 能操作页面 DOM，但不应成为特权中心。\u003c/li>\n\u003cli>service worker 有较高权限，却不能被视为常驻服务器。\u003c/li>\n\u003cli>UI 页面关闭后其内存状态会消失；side panel 虽可跨标签导航保持，但仍不应成为唯一真相来源。\u003c/li>\n\u003cli>状态跨上下文传播，本质上是分布式状态同步，而不是普通的模块调用。\u003c/li>\n\u003c/ol>\n\u003ch3>执行上下文不是代码目录，而是能力边界\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>上下文\u003c/th>\n\u003cth>适合承担的职责\u003c/th>\n\u003cth>关键约束\u003c/th>\n\u003cth>常见误用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Service worker\u003c/td>\n\u003ctd>事件协调、特权 API、跨标签状态、网络访问\u003c/td>\n\u003ctd>无 DOM、会被终止、全局变量不可靠\u003c/td>\n\u003ctd>当作常驻 Node 服务\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Content script\u003c/td>\n\u003ctd>读取和修改 DOM、监听页面交互、提取页面语义\u003c/td>\n\u003ctd>页面不可信、Chrome API 有限、随页面销毁\u003c/td>\n\u003ctd>直接持有密钥或开放任意特权调用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Popup\u003c/td>\n\u003ctd>短时命令面板和即时反馈\u003c/td>\n\u003ctd>失焦即关闭，生命周期极短\u003c/td>\n\u003ctd>承载长任务或唯一业务状态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Side panel\u003c/td>\n\u003ctd>与浏览过程并行的持续工作区\u003c/td>\n\u003ctd>需要独立状态同步，打开行为受用户动作约束\u003c/td>\n\u003ctd>复制一套与后台分叉的状态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Options page\u003c/td>\n\u003ctd>低频配置和授权说明\u003c/td>\n\u003ctd>不是运行时控制中心\u003c/td>\n\u003ctd>把动态工作流塞进设置页\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DevTools page/panel\u003c/td>\n\u003ctd>调试器、审计器、面向开发者的工具\u003c/td>\n\u003ctd>只在 DevTools 打开时存在\u003c/td>\n\u003ctd>假设普通页面场景中可用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Offscreen document\u003c/td>\n\u003ctd>service worker 必须使用的 DOM 能力\u003c/td>\n\u003ctd>隐藏、能力受限，主要靠 \u003ccode>runtime\u003c/code> 消息协作\u003c/td>\n\u003ctd>伪装成永不关闭的 background page\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>content script 默认运行在 isolated world：它能看到并修改页面 DOM，但 JavaScript 全局变量与页面及其他插件隔离。它能直接使用的扩展 API 也有限，更高权限操作通常要通过消息交给其他上下文。\u003ca href=\"https://developer.chrome.com/docs/extensions/develop/concepts/content-scripts\">Chrome：Content scripts\u003c/a>\u003c/p>\n\u003cp>这个隔离模型提供的是\u003cstrong>命名空间与执行环境隔离\u003c/strong>，不是完整的业务安全保证。content script 仍然读取攻击者控制的 DOM，也可能处于已被攻陷的渲染进程。因此从它发出的消息必须被当作外部输入，而不是“我方代码发来的可信函数参数”。\u003c/p>\n\u003ch2>二、Service Worker 改变了架构的时间观\u003c/h2>\n\u003cp>MV3 的 service worker 通常会在空闲 30 秒后被终止；单次请求处理超过 5 分钟，或 \u003ccode>fetch()\u003c/code> 响应等待超过 30 秒，也可能触发生命周期限制。事件或扩展 API 调用可以重置部分计时器，但官方仍要求系统能承受意外终止。\u003ca href=\"https://developer.chrome.com/docs/extensions/develop/concepts/service-workers/lifecycle\">Chrome：Extension service worker lifecycle\u003c/a>\u003c/p>\n\u003cp>这意味着：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">错误模型：启动一次 → 初始化全局状态 → 永久处理请求\n\n正确模型：事件到达 → 从持久状态重建最小上下文\n        → 执行可重试操作 → 原子地记录结果 → 允许进程消失\n\u003c/code>\u003c/pre>\n\u003ch3>把后台逻辑设计成可恢复状态机\u003c/h3>\n\u003cp>service worker 中适合保留缓存，但不能只保留真相。可靠设计至少包含：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>持久状态\u003c/strong>：用户配置、业务实体、任务阶段放入 \u003ccode>chrome.storage\u003c/code> 或 IndexedDB；\u003c/li>\n\u003cli>\u003cstrong>幂等事件\u003c/strong>：同一事件重复到达，不产生重复副作用；\u003c/li>\n\u003cli>\u003cstrong>显式任务阶段\u003c/strong>：长流程记录 \u003ccode>pending/running/succeeded/failed\u003c/code>，而不是依赖闭包中的 Promise 链；\u003c/li>\n\u003cli>\u003cstrong>可重建索引\u003c/strong>：内存 Map 是加速层，可由持久数据重新生成；\u003c/li>\n\u003cli>\u003cstrong>超时与重试语义\u003c/strong>：调用方知道请求是否超时、是否可以安全重发；\u003c/li>\n\u003cli>\u003cstrong>迁移机制\u003c/strong>：\u003ccode>runtime.onInstalled\u003c/code> 处理版本升级，但迁移本身也要可重入。\u003c/li>\n\u003c/ul>\n\u003cp>官方明确说明 service worker 关闭后全局变量会丢失，且 Web Storage API 在其中不可用；可选存储包括 \u003ccode>chrome.storage\u003c/code>、IndexedDB 和 CacheStorage。\u003ca href=\"https://developer.chrome.com/docs/extensions/develop/concepts/service-workers/lifecycle\">Chrome：Extension service worker lifecycle\u003c/a>\u003c/p>\n\u003cp>这与后端无状态服务有相似之处，但不能机械类比：插件只有一个本地浏览器配置文件，不一定需要远程数据库；真正需要借鉴的是“进程不是状态所有者”，而不是把本地插件过度设计成微服务。\u003c/p>\n\u003ch2>三、消息不是函数调用，而是内部协议\u003c/h2>\n\u003cp>Chrome 提供一次性消息和长连接两类机制，连接范围覆盖 service worker、extension pages 与 content scripts。\u003ca href=\"https://developer.chrome.com/docs/extensions/develop/concepts/messaging\">Chrome：Message passing\u003c/a>\u003c/p>\n\u003cp>把下面这种代码散布在各处：\u003c/p>\n\u003cpre>\u003ccode class=\"language-js\">chrome.runtime.sendMessage({ action: &quot;doSomething&quot;, data });\n\u003c/code>\u003c/pre>\n\u003cp>短期很快，长期会出现与后端 RPC 相同的问题：字段漂移、无版本、错误不可区分、请求与响应无法关联、权限检查遗漏。更稳妥的协议至少包含：\u003c/p>\n\u003cpre>\u003ccode class=\"language-ts\">type Request =\n  | {\n      version: 1;\n      id: string;\n      type: &quot;page.extract-selection&quot;;\n      payload: { tabId: number };\n    }\n  | {\n      version: 1;\n      id: string;\n      type: &quot;settings.update&quot;;\n      payload: { theme: &quot;light&quot; | &quot;dark&quot; };\n    };\n\ntype Response&lt;T&gt; =\n  | { id: string; ok: true; data: T }\n  | {\n      id: string;\n      ok: false;\n      error: { code: string; message: string; retryable: boolean };\n    };\n\u003c/code>\u003c/pre>\n\u003cp>协议设计的重点不是 TypeScript 类型本身，而是运行时约束：\u003c/p>\n\u003col>\n\u003cli>在接收端验证消息结构，静态类型不会验证跨上下文数据。\u003c/li>\n\u003cli>根据 \u003ccode>sender.id\u003c/code>、\u003ccode>sender.url\u003c/code>、\u003ccode>sender.tab\u003c/code> 和 frame 信息判断来源。\u003c/li>\n\u003cli>将消息类型映射到固定能力，禁止传入任意 URL、任意脚本或任意 Chrome API 参数。\u003c/li>\n\u003cli>对高风险动作再次检查授权和当前标签上下文。\u003c/li>\n\u003cli>为长任务返回任务 ID，不让消息通道承担任务生命周期。\u003c/li>\n\u003cli>记录结构化错误，而不是只依赖 \u003ccode>runtime.lastError\u003c/code> 或字符串。\u003c/li>\n\u003c/ol>\n\u003cp>Chrome 官方安全指南明确要求把 content script 视为较低信任来源：验证和清理输入、假设返回给它的数据可能泄露给页面，并限制它能触发的特权操作范围。\u003ca href=\"https://developer.chrome.com/docs/extensions/develop/concepts/messaging#security-considerations\">Chrome：Message passing — Security considerations\u003c/a>\u003c/p>\n\u003ch2>四、Manifest 是能力声明，也是威胁模型\u003c/h2>\n\u003cp>权限不只是安装时的一段配置，它同时影响：\u003c/p>\n\u003cul>\n\u003cli>插件能访问哪些浏览器能力和网站；\u003c/li>\n\u003cli>用户会看到哪些授权警告；\u003c/li>\n\u003cli>账号或插件被攻陷后的最大损害；\u003c/li>\n\u003cli>Chrome Web Store 的审核与更新体验；\u003c/li>\n\u003cli>架构能否把高风险能力延迟到真正需要时再申请。\u003c/li>\n\u003c/ul>\n\u003cp>Chrome 将权限分成 API 权限、可选 API 权限、content script 匹配范围、host permissions 和 optional host permissions。host permission 可影响跨域请求、敏感 tab 属性、脚本注入以及网络请求控制等能力。\u003ca href=\"https://developer.chrome.com/docs/extensions/develop/concepts/declare-permissions\">Chrome：Declare permissions\u003c/a>\u003c/p>\n\u003ch3>权限设计应从用户动作反推\u003c/h3>\n\u003cp>不要先写 \u003ccode>&lt;all_urls&gt;\u003c/code> 再想产品功能，而应从能力链路倒推：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">用户动作\n  → 需要访问的页面/数据\n  → 最小 Chrome API\n  → 最小 host 范围与持续时间\n  → 是否可使用 activeTab 或 optional permission\n\u003c/code>\u003c/pre>\n\u003cp>例如，一个只在用户点击按钮后增强当前页的插件，通常更适合 \u003ccode>activeTab + scripting\u003c/code>，而不是永久获得所有站点权限。\u003ccode>activeTab\u003c/code> 能为当前用户动作授予临时 host 访问；程序化注入则需要 \u003ccode>scripting\u003c/code> 加 host permission 或 \u003ccode>activeTab\u003c/code>。\u003ca href=\"https://developer.chrome.com/docs/extensions/reference/api/scripting\">Chrome：Scripting API\u003c/a>\u003c/p>\n\u003cp>最小权限不是形式主义。Chrome 的安全建议指出，权限越少，插件被攻陷后可利用的能力也越少；\u003ccode>externally_connectable\u003c/code>、web-accessible resources 和内容安全策略同样应按最小范围声明。\u003ca href=\"https://developer.chrome.com/docs/extensions/develop/security-privacy/stay-secure\">Chrome：Stay secure\u003c/a>\u003c/p>\n\u003ch3>把插件视作浏览器中的“高价值代理”\u003c/h3>\n\u003cp>典型攻击链不是只攻击 DOM：\u003c/p>\n\u003cfigure class=\"diagram\">\u003csvg id=\"personal-learning-learn-frontend-browser-chrome-extension-architecture-md-2\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" class=\"flowchart\" style=\"max-width: 1266.73px; background-color: white;\" viewBox=\"0 0 1266.734375 94\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\">\u003cstyle>#personal-learning-learn-frontend-browser-chrome-extension-architecture-md-2{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#personal-learning-learn-frontend-browser-chrome-extension-architecture-md-2 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#personal-learning-learn-frontend-browser-chrome-extension-architecture-md-2 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#personal-learning-learn-frontend-browser-chrome-extension-architecture-md-2 .error-icon{fill:#552222;}#personal-learning-learn-frontend-browser-chrome-extension-architecture-md-2 .error-text{fill:#552222;stroke:#552222;}#personal-learning-learn-frontend-browser-chrome-extension-architecture-md-2 .edge-thickness-normal{stroke-width:1px;}#personal-learning-learn-frontend-browser-chrome-extension-architecture-md-2 .edge-thickness-thick{stroke-width:3.5px;}#personal-learning-learn-frontend-browser-chrome-extension-architecture-md-2 .edge-pattern-solid{stroke-dasharray:0;}#personal-learning-learn-frontend-browser-chrome-extension-architecture-md-2 .edge-thickness-invisible{stroke-width:0;fill:none;}#personal-learning-learn-frontend-browser-chrome-extension-architecture-md-2 .edge-pattern-dashed{stroke-dasharray:3;}#personal-learning-learn-frontend-browser-chrome-extension-architecture-md-2 .edge-pattern-dotted{stroke-dasharray:2;}#personal-learning-learn-frontend-browser-chrome-extension-architecture-md-2 .marker{fill:#333333;stroke:#333333;}#personal-learning-learn-frontend-browser-chrome-extension-architecture-md-2 .marker.cross{stroke:#333333;}#personal-learning-learn-frontend-browser-chrome-extension-architecture-md-2 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#personal-learning-learn-frontend-browser-chrome-extension-architecture-md-2 p{margin:0;}#personal-learning-learn-frontend-browser-chrome-extension-architecture-md-2 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#personal-learning-learn-frontend-browser-chrome-extension-architecture-md-2 .cluster-label text{fill:#333;}#personal-learning-learn-frontend-browser-chrome-extension-architecture-md-2 .cluster-label span{color:#333;}#personal-learning-learn-frontend-browser-chrome-extension-architecture-md-2 .cluster-label span p{background-color:transparent;}#personal-learning-learn-frontend-browser-chrome-extension-architecture-md-2 .label text,#personal-learning-learn-frontend-browser-chrome-extension-architecture-md-2 span{fill:#333;color:#333;}#personal-learning-learn-frontend-browser-chrome-extension-arch
