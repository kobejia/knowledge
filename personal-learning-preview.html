rations-docker-docker-md-3-state-Thrashed-5\" data-look=\"classic\" transform=\"translate(116.44140625, 458)\">\u003crect class=\"basic label-container\" style=\"\" rx=\"5\" ry=\"5\" x=\"-40.7578125\" y=\"-20\" width=\"81.515625\" height=\"40\"/>\u003cg class=\"label\" style=\"\" transform=\"translate(-32.7578125, -12)\">\u003crect/>\u003cforeignObject width=\"65.515625\" height=\"24\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\">\u003cspan class=\"nodeLabel markdown-node-label\">\u003cp>Thrashed\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"node  statediagram-state\" id=\"personal-learning-learn-operations-docker-docker-md-3-state-OOM-6\" data-look=\"classic\" transform=\"translate(116.44140625, 572)\">\u003crect class=\"basic label-container\" style=\"\" rx=\"5\" ry=\"5\" x=\"-24.4609375\" y=\"-20\" width=\"48.921875\" height=\"40\"/>\u003cg class=\"label\" style=\"\" transform=\"translate(-16.4609375, -12)\">\u003crect/>\u003cforeignObject width=\"32.921875\" height=\"24\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\">\u003cspan class=\"nodeLabel markdown-node-label\">\u003cp>OOM\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"node  statediagram-state\" id=\"personal-learning-learn-operations-docker-docker-md-3-state-Restarted-7\" data-look=\"classic\" transform=\"translate(174.3203125, 686)\">\u003crect class=\"basic label-container\" style=\"\" rx=\"5\" ry=\"5\" x=\"-42.4140625\" y=\"-20\" width=\"84.828125\" height=\"40\"/>\u003cg class=\"label\" style=\"\" transform=\"translate(-34.4140625, -12)\">\u003crect/>\u003cforeignObject width=\"68.828125\" height=\"24\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\">\u003cspan class=\"nodeLabel markdown-node-label\">\u003cp>Restarted\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003cdefs>\u003cfilter id=\"personal-learning-learn-operations-docker-docker-md-3-drop-shadow\" height=\"130%\" width=\"130%\">\u003cfeDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"/>\u003c/filter>\u003c/defs>\u003cdefs>\u003cfilter id=\"personal-learning-learn-operations-docker-docker-md-3-drop-shadow-small\" height=\"150%\" width=\"150%\">\u003cfeDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"/>\u003c/filter>\u003c/defs>\u003c/svg>\u003c/figure>\u003cp>restart policy 可能制造循环，而不是修复泄漏、错误容量模型或无背压的流量入口。Docker 默认也不会自动为容器设置资源约束；未设置限制的容器可以按照宿主调度器允许的范围竞争资源。\u003ca href=\"https://docs.docker.com/engine/containers/resource_constraints/\">Docker resource constraints\u003c/a>\u003c/p>\n\u003cp>资源限制不是性能保证：\u003c/p>\n\u003cul>\n\u003cli>CPU quota 限制可消耗的时间，过紧会产生周期性 throttling；\u003c/li>\n\u003cli>memory limit 到达后可能触发回收或 OOM kill，并不等于应用获得稳定延迟；\u003c/li>\n\u003cli>容器内看到的 CPU、内存和负载信息是否反映 cgroup 边界，取决于内核、运行时和工具版本；\u003c/li>\n\u003cli>不设置限制意味着容器可以与宿主其他进程竞争资源。\u003c/li>\n\u003c/ul>\n\u003cp>生产容量设计还需配合应用并发模型、队列长度、超时和降级策略。cgroup 只能约束资源，不能让不具备背压能力的服务自动可靠。\u003c/p>\n\u003ch2>三、镜像是内容寻址的文件系统变更序列\u003c/h2>\n\u003cp>OCI 镜像不是一个完整磁盘文件，而是配置、manifest 与有序 layer 的组合。layer 表示 root filesystem 的变更；镜像配置还描述入口、环境变量和工作目录等执行参数。\u003ca href=\"https://specs.opencontainers.org/image-spec/config/\">OCI Image Configuration\u003c/a>\u003c/p>\n\u003cp>tag 是可移动的人类标签，digest 是内容身份：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">repository:tag  ──可重新指向──&gt; manifest digest\n                                  │\n                                  ├── config digest\n                                  └── layer digest × N\n\u003c/code>\u003c/pre>\n\u003cp>部署使用 \u003ccode>latest\u003c/code> 或普通 tag 只能表达选择意图，不能证明实际内容没有变化。要求可重复部署和审计时，应记录或锁定 digest；更新策略再决定何时接受新 digest。\u003c/p>\n\u003cp>镜像层通过联合文件系统或 snapshotter 组合为容器可见的 root filesystem。容器再获得一个可写层；首次修改下层文件可能发生 copy-up，因此可写层不适合高写入量或需要独立生命周期的数据。Docker 官方也建议将写密集数据放入 volume，而不是容器 writable layer。\u003ca href=\"https://docs.docker.com/engine/storage/drivers/\">Docker storage drivers\u003c/a>\u003c/p>\n\u003cp>需要区分稳定概念和当前实现：Docker Engine 29.0 起，全新安装默认使用 containerd image store 与 snapshotter；经典 \u003ccode>overlay2\u003c/code> storage driver 已不是所有新安装的默认后端，但分层、copy-on-write 和 writable layer 的心智模型仍成立。\u003ca href=\"https://docs.docker.com/engine/storage/drivers/select-storage-driver/\">Select a storage driver\u003c/a>\u003c/p>\n\u003ch2>四、构建本质上是依赖图求值\u003c/h2>\n\u003cp>现代 Docker 构建由 BuildKit 执行。它将 Dockerfile frontend 转换为低层构建定义（LLB），依据操作和挂载内容的校验和管理缓存，可以跳过未使用阶段、并行执行独立阶段并只传输变化的上下文。\u003ca href=\"https://docs.docker.com/build/buildkit/\">BuildKit\u003c/a>\u003c/p>\n\u003cp>一个可维护的 Dockerfile 应让变化频率与缓存边界一致：先复制依赖清单并安装依赖，再复制高频变化的业务源码。顺序的价值不在“层数越少越好”，而在减少无关变化导致的缓存失效。\u003c/p>\n\u003cpre>\u003ccode class=\"language-dockerfile\"># syntax=docker/dockerfile:1\nFROM node:22-bookworm-slim AS dependencies\nWORKDIR /app\nCOPY package.json package-lock.json ./\nRUN --mount=type=cache,target=/root/.npm npm ci\n\nFROM dependencies AS build\nCOPY . .\nRUN npm run build\n\nFROM node:22-bookworm-slim AS runtime\nENV NODE_ENV=production\nWORKDIR /app\nCOPY --from=build /app/dist ./dist\nUSER node\nCMD [&quot;node&quot;, &quot;dist/server.js&quot;]\n\u003c/code>\u003c/pre>\n\u003cp>多阶段构建把编译工具和最终运行环境分离，减少运行镜像中的无关文件与攻击面。BuildKit 只构建目标阶段依赖的阶段。\u003ca href=\"https://docs.docker.com/build/building/multi-stage/\">Docker multi-stage builds\u003c/a>\u003c/p>\n\u003cp>构建参数和环境变量不适合传递密钥，因为它们可能持久化进镜像元数据或层。BuildKit secret mount 和 SSH mount 只在目标 \u003ccode>RUN\u003c/code> 指令期间提供凭据，避免把凭据复制进最终镜像。\u003ca href=\"https://docs.docker.com/build/building/secrets/\">Docker build secrets\u003c/a>\u003c/p>\n\u003cp>可重复构建仍有边界：基础镜像 tag、包仓库索引、时间戳、非确定性编译和远程下载都会改变结果。锁定 digest、固定依赖、生成 SBOM 与 provenance 能提高可追溯性，但“同一 Dockerfile”本身不保证字节级相同镜像。\u003c/p>\n\u003cp>\u003ccode>.dockerignore\u003c/code> 不只是缩短上下文传输时间：它也减少无关文件进入缓存键或被误复制到镜像的机会。把整个仓库先 \u003ccode>COPY . .\u003c/code> 再安装依赖，会让任何源码变化都使依赖层失效。缓存优化的核心不是压缩层数，而是让依赖边界与变化边界一致。\u003c/p>\n\u003ch2>五、数据生命周期必须与容器生命周期解耦\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>机制\u003c/th>\n\u003cth>生命周期与所有权\u003c/th>\n\u003cth>适合场景\u003c/th>\n\u003cth>主要风险\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Writable layer\u003c/td>\n\u003ctd>随容器实例存在\u003c/td>\n\u003ctd>临时文件、小量短期写入\u003c/td>\n\u003ctd>重建即丢失、copy-up 成本、难备份\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Named volume\u003c/td>\n\u003ctd>由 Docker 管理，独立于单个容器\u003c/td>\n\u003ctd>数据库、持久应用数据\u003c/td>\n\u003ctd>仍需明确备份、权限和迁移策略\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Bind mount\u003c/td>\n\u003ctd>直接映射宿主路径\u003c/td>\n\u003ctd>本地开发、明确的宿主文件集成\u003c/td>\n\u003ctd>宿主耦合、路径权限、越权读写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>tmpfs\u003c/td>\n\u003ctd>仅在内存中，停止后消失\u003c/td>\n\u003ctd>临时敏感数据或高速临时状态\u003c/td>\n\u003ctd>占用宿主内存，不提供持久性\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>volume 只是持久化机制，不是备份。可靠的数据方案还要回答：谁执行一致性快照、如何恢复、版本升级怎样迁移、容器 UID/GID 如何映射、存储故障如何暴露给应用。\u003c/p>\n\u003cp>不要把数据库的活跃数据目录随意放在容器 writable layer；也不要因为 bind mount 使用方便，就把 \u003ccode>/\u003c/code>、Docker socket 或宽泛宿主目录暴露给应用容器。\u003c/p>\n\u003ch2>六、网络隔离与端口发布是两件事\u003c/h2>\n\u003cp>Docker 网络是可插拔的。\u003ccode>bridge\u003c/code> 适合同一宿主上的容器通信，\u003ccode>host\u003c/code> 移除容器与宿主之间的网络隔离，\u003ccode>overlay\u003c/code> 连接多个 daemon 主机，\u003ccode>ipvlan\u003c/code> 和 \u003ccode>macvlan\u003c/code> 则提供更接近底层网络的集成方式。\u003ca href=\"https://docs.docker.com/engine/network/drivers/\">Docker network drivers\u003c/a>\u003c/p>\n\u003cp>用户自定义 bridge 通常比默认 bridge 更适合应用：它提供基于容器名的 DNS 发现，并允许用网络成员关系表达服务边界。应用应连接数据库的容器端口，而不是依赖发布到宿主的端口。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">容器监听 0.0.0.0:3000\n        │ 容器 network namespace 内\n        ▼\nbridge / veth ── host firewall 与 NAT ── 宿主 127.0.0.1:8080 或 0.0.0.0:8080\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>EXPOSE 3000\u003c/code> 主要是镜像元数据和文档，不会自动发布端口。\u003ccode>-p 8080:3000\u003c/code> 才创建宿主到容器的映射；绑定 \u003ccode>0.0.0.0\u003c/code> 可能向所有宿主接口开放，绑定 \u003ccode>127.0.0.1\u003c/code> 则限制为本机访问。\u003c/p>\n\u003cp>在 Linux bridge 网络中，Docker 会创建 iptables 或 nftables 规则实现隔离、端口发布和 masquerading。关闭 Docker 的规则管理通常会破坏网络，且 Docker 的 NAT 路径可能绕过某些基于 \u003ccode>ufw\u003c/code> 的直觉配置。\u003ca href=\"https://docs.docker.com/engine/network/packet-filtering-firewalls/\">Docker packet filtering and firewalls\u003c/a>\u003c/p>\n\u003ch2>七、安全边界：减少权限，而不是相信容器\u003c/h2>\n\u003cp>容器安全要同时处理四层：镜像供应链、daemon 控制面、容器配置和宿主内核。\u003c/p>\n\u003ch3>Daemon 与运行配置\u003c/h3>\n\u003cul>\n\u003cli>不把 Docker socket 挂载给普通应用；这通常等价于授予宿主级控制权。\u003c/li>\n\u003cli>避免 \u003ccode>--privileged\u003c/code>；它会显著扩大设备、capability 和内核接口访问。\u003c/li>\n\u003cli>默认删除不需要的 capability，只按能力补回；容器内使用非 root 用户。\u003c/li>\n\u003cli>保留默认 seccomp 配置。Docker 默认策略会限制一组高风险系统调用，并在兼容性和最小权限之间取折中。\u003ca href=\"https://docs.docker.com/engine/security/seccomp/\">Docker seccomp\u003c/a>\u003c/li>\n\u003cli>将 root filesystem 设为只读，并为确实需要写入的位置单独挂载可写存储。\u003c/li>\n\u003cli>限制 CPU、内存和进程数，避免单个容器拖垮宿主。\u003c/li>\n\u003c/ul>\n\u003cp>Rootless mode 把 daemon 和容器都运行在非 root 用户的 user namespace 中，可降低 daemon 或 runtime 漏洞的影响；它不同于只对容器启用 \u003ccode>userns-remap\u003c/code>，后者的 daemon 仍以 root 运行。Rootless 也有网络、cgroup、端口和存储方面的环境要求，不能只当作无代价开关。\u003ca href=\"https://docs.docker.com/engine/security/rootless/\">Docker rootless mode\u003c/a>\u003c/p>\n\u003ch3>供应链\u003c/h3>\n\u003cp>镜像安全不是“扫描一次 CVE”：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">来源可信\n  -&gt; 依赖与基础镜像锁定\n  -&gt; 可重复、无密钥构建\n  -&gt; SBOM / provenance / 签名\n  -&gt; Registry 权限与不可变策略\n  -&gt; 部署按 digest\n  -&gt; 持续发现新漏洞并重建\n\u003c/code>\u003c/pre>\n\u003cp>扫描结果受漏洞数据库、发行版回补策略和依赖可见性影响。没有已知 CVE 不代表没有漏洞；发现 CVE 也不等于该漏洞在当前运行路径中可利用。风险判断应结合可达性、权限、暴露面和修复版本。\u003c/p>\n\u003cp>BuildKit 可以在构建时生成 SBOM 与 provenance attestation，并把它们作为与镜像关联的元数据发布。\u003ca href=\"https://docs.docker.com/build/metadata/attestations/\">Docker build attestations\u003c/a> OCI Image 与 Distribution Specification 1.1 引入标准化的 artifact 关联和 referrers 能力，使这类元数据不必伪装成普通镜像 tag。\u003ca href=\"https://opencontainers.org/posts/blog/2024-03-13-image-and-distribution-1-1/\">OCI Image and Distribution 1.1\u003c/a> 但“有 SBOM”只证明生成了一份成分描述，“有 provenance”只提供构建声明；是否信任仍取决于构建身份、签名验证、策略和输入锁定。\u003c/p>\n\u003cp>截至查证基线，Docker Engine 29.0 已移除 CLI 内置的 Docker Content Trust；旧的 \u003ccode>DOCKER_CONTENT_TRUST=1\u003c/code> 教程不再代表当前默认签名路径。\u003ca href=\"https://docs.docker.com/engine/release-notes/29/\">Docker Engine 29 release notes\u003c/a> 生产策略应明确采用的签名与验证工具，而不是模糊写成“开启 DCT”。\u003c/p>\n\u003ch2>八、Compose、编排与 Docker 的责任边界\u003c/h2>\n\u003cp>Compose 用声明文件描述多容器应用的服务、网络、volume 和依赖关系，适合本地开发、集成环境和单机部署。它改善可重复启动，但不会自动提供跨主机调度、控制器式自愈、滚动发布、全局服务发现或复杂密钥治理。\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">services:\n  api:\n    image: registry.example.com/api@sha256:REPLACE_WITH_REAL_DIGEST\n    ports:\n      - &quot;127.0.0.1:8080:3000&quot;\n    read_only: true\n    tmpfs:\n      - /tmp\n    volumes:\n      - app-data:/var/lib/example\n    healthcheck:\n      test: [&quot;CMD&quot;, &quot;node&quot;, &quot;healthcheck.js&quot;]\n      interval: 10s\n      timeout: 2s\n      retries: 3\n    restart: on-failure:3\n\nvolumes:\n  app-data:\n\u003c/code>\u003c/pre>\n\u003cp>这里的 digest 是部署身份，healthcheck 是容器局部信号，restart policy 是失败后的单机动作，volume 是数据所有权声明。四者组合起来仍然没有定义数据库迁移、请求排空、跨主机调度或业务幂等。\u003c/p>\n\u003cp>健康检查、restart policy 和 \u003ccode>depends_on\u003c/code> 也不能代替应用级就绪协议：\u003c/p>\n\u003cul>\n\u003cli>进程存活不等于服务能够正确处理请求；\u003c/li>\n\u003cli>启动顺序不等于依赖在整个运行期持续可用；\u003c/li>\n\u003cli>自动重启可能掩盖确定性崩溃并形成重启风暴；\u003c/li>\n\u003cli>数据库迁移、消息重复和外部副作用仍需应用设计幂等与恢复语义。\u003c/li>\n\u003c/ul>\n\u003cp>当需求扩大到跨主机调度、声明式收敛、服务身份、策略与弹性时，需要 Swarm、Kubernetes 或其他编排系统。编排器不是 Docker 的“高级命令集合”，而是持续比较期望状态与实际状态并执行协调的控制系统。\u003c/p>\n\u003ch2>九、生产运行：可观测性必须覆盖边界\u003c/h2>\n\u003cp>容器日志通常来自主进程的 stdout/stderr，logging driver 决定日志如何在宿主保存或转发。仅有应用日志不足以解释资源与运行时问题；生产观测至少需要连接五类信号：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>信号\u003c/th>\n\u003cth>回答的问题\u003c/th>\n\u003cth>常见盲区\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>应用日志与 trace\u003c/td>\n\u003ctd>哪个请求、任务或依赖失败\u003c/td>\n\u003ctd>OOM kill 时可能没有应用日志\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>应用指标\u003c/td>\n\u003ctd>延迟、吞吐、错误和队列是否异常\u003c/td>\n\u003ctd>不自动解释宿主争用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>docker events\u003c/code> 与容器状态\u003c/td>\n\u003ctd>谁创建、停止、杀死或重启实例\u003c/td>\n\u003ctd>默认不是长期审计存储\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>cgroup 与宿主指标\u003c/td>\n\u003ctd>CPU throttling、内存压力、I/O 是否受限\u003c/td>\n\u003ctd>平均值会隐藏尾延迟和突发压力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>镜像 digest 与运行配置\u003c/td>\n\u003ctd>实际运行的制品和权限是什么\u003c/td>\n\u003ctd>tag 不能证明内容身份\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>健康检查不应执行昂贵业务，也不应只判断进程存在。它应检测实例是否具备承担目标流量的最低条件，同时避免把短暂依赖抖动放大成重启风暴。优雅停止要求 PID 1 正确处理停止信号、停止接收新工作、完成或转移在途任务，并在超时前退出；否则滚动替换只是受控地中断请求。\u003c/p>\n\u003cp>制品晋级应坚持“构建一次，按 digest 流转”，避免测试环境和生产环境分别重建同一源码：\u003c/p>\n\u003cfigure class=\"diagram\">\u003csvg id=\"personal-learning-learn-operations-docker-docker-md-4\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" class=\"flowchart\" style=\"max-width: 1753.48px; background-color: white;\" viewBox=\"0 0 1753.484375 209\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\">\u003cstyle>#personal-learning-learn-operations-docker-docker-md-4{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#personal-learning-learn-operations-docker-docker-md-4 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#personal-learning-learn-operations-docker-docker-md-4 .edge-animation-fas r;\">\u003cspan class=\"nodeLabel\">\u003cp>部署并记录实际 digest\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"node default\" id=\"personal-learning-learn-operations-docker-docker-md-4-flowchart-Observe-17\" data-look=\"classic\" transform=\"translate(1429.484375, 87)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-94\" y=\"-27\" width=\"188\" height=\"54\"/>\u003cg class=\"label\" style=\"\" transform=\"translate(-64, -12)\">\u003crect/>\u003cforeignObject width=\"128\" height=\"24\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\">\u003cspan class=\"nodeLabel\">\u003cp>日志、指标、事件\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"node default\" id=\"personal-learning-learn-operations-docker-docker-md-4-flowchart-Rebuild-19\" data-look=\"classic\" transform=\"translate(1659.484375, 118)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-86\" y=\"-27\" width=\"172\" height=\"54\"/>\u003cg class=\"label\" style=\"\" transform=\"translate(-56, -12)\">\u003crect/>\u003cforeignObject width=\"112\" height=\"24\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\">\u003cspan class=\"nodeLabel\">\u003cp>输入变化后重建\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003cdefs>\u003cfilter id=\"personal-learning-learn-operations-docker-docker-md-4-drop-shadow\" height=\"130%\" width=\"130%\">\u003cfeDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"/>\u003c/filter>\u003c/defs>\u003cdefs>\u003cfilter id=\"personal-learning-learn-operations-docker-docker-md-4-drop-shadow-small\" height=\"150%\" width=\"150%\">\u003cfeDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"/>\u003c/filter>\u003c/defs>\u003c/svg>\u003c/figure>\u003ch2>十、生产故障通常来自被忽略的边界\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>常见根因\u003c/th>\n\u003cth>应检查的模型\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>容器反复重启\u003c/td>\n\u003ctd>PID 1 退出、错误信号处理、确定性配置错误\u003c/td>\n\u003ctd>进程生命周期与 restart policy\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>构建缓存总失效\u003c/td>\n\u003ctd>Dockerfile 顺序、上下文过大、非确定性下载\u003c/td>\n\u003ctd>BuildKit 依赖图\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>镜像很小但启动慢\u003c/td>\n\u003ctd>远程依赖、初始化、解压或运行期编译\u003c/td>\n\u003ctd>镜像大小不等于启动路径成本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>数据在升级后丢失\u003c/td>\n\u003ctd>写入 writable layer、volume 指向错误\u003c/td>\n\u003ctd>数据与实例生命周期\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>本机可访问，外部不可访问\u003c/td>\n\u003ctd>应用只监听 loopback、端口绑定或防火墙问题\u003c/td>\n\u003ctd>两层 network namespace 与发布路径\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>宿主防火墙规则失效\u003c/td>\n\u003ctd>Docker NAT 链改变了数据包路径\u003c/td>\n\u003ctd>Docker 与宿主 firewall 集成\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>容器 OOM 或延迟抖动\u003c/td>\n\u003ctd>memory limit、CPU throttling、无背压\u003c/td>\n\u003ctd>cgroup 与应用资源模型\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>镜像更新但实例没变化\u003c/td>\n\u003ctd>tag 缓存、未拉取新 digest\u003c/td>\n\u003ctd>tag 与内容身份\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>“容器内 root”突破边界\u003c/td>\n\u003ctd>socket 挂载、privileged、过宽 capability、内核漏洞\u003c/td>\n\u003ctd>daemon 与共享内核攻击面\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>排障时先确认容器实际运行的 image digest、配置、mount、network、资源限制和退出原因，再进入应用日志。只盯 Dockerfile 或只盯应用代码都会错过另一半事实。\u003c/p>\n\u003cp>稳定的排障顺序是先固定事实，再提出假设：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">1. 制品：实际 image ID / repo digest 是否是预期版本？\n2. 生命周期：状态、退出码、OOMKilled、重启次数和事件是什么？\n3. 进程：PID 1、信号、子进程与监听地址是否正确？\n4. 资源：CPU throttling、内存压力、PIDs、磁盘与 inode 是否耗尽？\n5. 数据：实际 mount 类型、源路径、权限和剩余空间是什么？\n6. 网络：容器内监听、DNS、路由、端口发布和宿主防火墙分别如何？\n7. 应用：前六层事实稳定后，再解释业务日志、依赖与代码路径。\n\u003c/code>\u003c/pre>\n\u003cp>常用观察入口包括 \u003ccode>docker inspect\u003c/code>、\u003ccode>docker events\u003c/code>、\u003ccode>docker logs\u003c/code>、\u003ccode>docker stats\u003c/code>、\u003ccode>docker top\u003c/code>、\u003ccode>docker network inspect\u003c/code> 和 \u003ccode>docker system df\u003c/code>。它们提供的是不同切面，而不是一个命令给出根因；关键字段仍需与宿主内核、日志后端和应用指标关联。\u003c/p>\n\u003ch2>十一、如何判断是否应该使用 Docker\u003c/h2>\n\u003cp>Docker 适合需要统一制品格式、隔离依赖、提高环境一致性、在 CI 与部署间复用同一镜像的系统。它尤其适合无状态服务、批处理任务、标准化开发环境和需要 OCI 生态互操作的交付链路。\u003c/p>\n\u003cp>以下情况需要谨慎：\u003c/p>\n\u003cul>\n\u003cli>单机上极简单、已有成熟系统包和 systemd 管理的服务，容器层可能只增加间接性；\u003c/li>\n\u003cli>强依赖特殊内核模块、硬件、低延迟网络或复杂设备访问的工作负载，需要额外验证隔离和性能；\u003c/li>\n\u003cli>状态系统若没有独立的数据、备份和恢复设计，容器化不会自动提高可靠性；\u003c/li>\n\u003cli>把 Docker 当作安全沙箱运行不可信代码时，共享内核边界通常不足，应评估 microVM、沙箱 runtime 或更强隔离方案；\u003c/li>\n\u003cli>团队尚未管理镜像生命周期、Registry 权限和漏洞修复时，容器会把“环境漂移”转化为“供应链漂移”，而不是消除问题。\u003c/li>\n\u003c/ul>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方案\u003c/th>\n\u003cth>主要抽象\u003c/th>\n\u003cth>隔离边界\u003c/th>\n\u003cth>适合的主问题\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>systemd + 系统包\u003c/td>\n\u003ctd>宿主服务与发行版包\u003c/td>\n\u003ctd>进程、用户及宿主策略\u003c/td>\n\u003ctd>单机、依赖简单、操作模型成熟\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Docker / Podman\u003c/td>\n\u003ctd>OCI 镜像与容器\u003c/td>\n\u003ctd>共享内核下的受约束进程\u003c/td>\n\u003ctd>统一制品、依赖隔离和交付一致性\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>containerd + nerdctl\u003c/td>\n\u003ctd>更直接的 runtime 工作流\u003c/td>\n\u003ctd>共享内核\u003c/td>\n\u003ctd>平台团队或不需要 Docker daemon API 的环境\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>虚拟机\u003c/td>\n\u003ctd>虚拟硬件与独立内核\u003c/td>\n\u003ctd>hypervisor\u003c/td>\n\u003ctd>强租户边界、不同内核或完整操作系统\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>沙箱 runtime / microVM\u003c/td>\n\u003ctd>加强隔离的容器执行环境\u003c/td>\n\u003ctd>用户态内核或轻量 VM\u003c/td>\n\u003ctd>不可信、多租户或高风险工作负载\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Kubernetes 等编排器\u003c/td>\n\u003ctd>期望状态与控制循环\u003c/td>\n\u003ctd>取决于底层 runtime\u003c/td>\n\u003ctd>跨主机调度、服务治理和持续收敛\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Podman 与 Docker 可以共享 OCI 制品和许多 CLI 习惯，但 daemon 模型、rootless 行为、网络及 Compose 兼容性并非完全相同。Kubernetes 也不“运行 Docker 命令”：它通过 Container Runtime Interface 管理兼容 runtime。比较方案时，应以控制面、隔离边界和运维责任为单位，而不是按命令相似度判断可替换性。\u003c/p>\n\u003cp>真正值得掌握的不是命令数量，而是以下不变量：容器是进程，镜像是内容寻址的输入，数据必须独立于实例，网络发布会穿越隔离边界，daemon 权限接近宿主控制权，资源限制不等于可靠性，构建可重复性需要主动设计。\u003c/p>\n\u003ch2>延伸阅读\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"https://docs.docker.com/get-started/docker-overview/\">Docker architecture\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://docs.docker.com/engine/security/\">Docker Engine security\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://docs.docker.com/build/buildkit/\">BuildKit\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://docs.docker.com/engine/network/drivers/\">Docker network drivers\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://docs.docker.com/engine/storage/drivers/\">Docker storage drivers\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://opencontainers.org/\">Open Container Initiative\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://www.kernel.org/doc/html/latest/admin-guide/cgroup-v2.html\">Linux cgroup v2\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://docs.docker.com/engine/release-notes/29/\">Docker Engine 29 release notes\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://docs.docker.com/engine/containers/resource_constraints/\">Docker resource constraints\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://docs.docker.com/engine/containers/runmetrics/\">Docker runtime metrics\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://docs.docker.com/engine/storage/containerd/\">Docker containerd image store\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://docs.docker.com/build/metadata/attestations/\">Docker build attestations\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://opencontainers.org/posts/blog/2024-03-13-image-and-distribution-1-1/\">OCI Image and Distribution 1.1\u003c/a>\u003c/li>\n\u003c/ul>\n"},"verification-code-registration-login":{"id":"verification-code-registration-login","title":"邮箱与手机号验证码认证：从一次性挑战到可撤销登录态","relativePath":"learn/backend/authentication/verification-code-registration-login.md","html":"\u003ch1>邮箱与手机号验证码认证：从一次性挑战到可撤销登录态\u003c/h1>\n\u003cblockquote>\n\u003cp>查证基线：2026-08-01。本文讨论面向普通 Web 与移动应用的邮箱/短信验证码注册和无密码登录。NIST SP 800-63B 的要求面向特定数字身份保证等级，不能机械等同于所有消费产品合规要求，但它为判断认证通道强度提供了清晰基线。\u003c/p>\n\u003c/blockquote>\n\u003ch2>核心判断：验证码完成一次认证，Session 才维持登录态\u003c/h2>\n\u003cp>邮箱或短信验证码流程包含两个不能混为一谈的状态机：\u003c/p>\n\u003col>\n\u003cli>**一次性挑战（challenge）**回答“当前请求者是否在有限时间内控制这个邮箱或手机号”；\u003c/li>\n\u003cli>**登录会话（session）**回答“后续每个请求应以哪个用户身份执行，以及这份授权是否仍然有效”。\u003c/li>\n\u003c/ol>\n\u003cp>验证码校验成功不会让 HTTP 自动变成“已登录”。服务端还必须创建一个可过期、可轮换、可撤销的会话，并通过安全 Cookie 或客户端 Token 将后续请求关联到该会话。反过来，验证码也不是用户的永久身份：邮箱可能被接管，手机号可能发生 SIM Swap 或被运营商回收，通知内容还可能暴露在锁屏界面。\u003c/p>\n\u003cp>更重要的是，“验证联系方式”和“使用联系方式认证”具有不同安全语义。OWASP 建议先验证邮箱所有权再启用账号，同时将邮箱视为较弱的认证因素；NIST SP 800-63B 明确不接受邮箱作为带外认证通道，并对公共电话网络承载的短信/语音验证施加额外限制。\u003ca href=\"https://cheatsheetseries.owasp.org/cheatsheets/Email_Validation_and_Verification_Cheat_Sheet.html\">OWASP：Email Validation and Verification\u003c/a> \u003ca href=\"https://pages.nist.gov/800-63-4/sp800-63b.html#out-of-band-authenticators\">NIST SP 800-63B：Out-of-Band Authenticators\u003c/a>\u003c/p>\n\u003cp>因此，消费应用可以将邮箱或短信验证码作为便利的无密码登录方式，但不应把它描述为抗钓鱼的强认证。涉及支付、修改主认证器、导出敏感数据等高风险操作时，应结合风险信号重新认证，并优先引入 Passkey/WebAuthn 等抗钓鱼认证器。\u003c/p>\n\u003ch2>一、先画清信任边界：验证码证明的是通道控制权\u003c/h2>\n\u003cp>下面的图回答“服务端实际上信任了谁”。它是依据 NIST、OWASP 和通信系统常见边界重建的分析图，不是官方架构原图。\u003c/p>\n\u003cfigure class=\"diagram\">\u003csvg id=\"personal-learning-learn-backend-authentication-verification-code-registration-login-md-1\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" class=\"flowchart\" style=\"max-width: 1610.7px; background-color: white;\" viewBox=\"0 0 1610.703125 255\" role=\"graphics-document document\" aria-roledescrip u003cg class=\"node default\" id=\"personal-learning-learn-backend-authentication-verification-code-registration-login-md-1-flowchart-Device-6\" data-look=\"classic\" transform=\"translate(1486.921875, 169)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-115.78125\" y=\"-39\" width=\"231.5625\" height=\"78\"/>\u003cg class=\"label\" style=\"\" transform=\"translate(-85.78125, -24)\">\u003crect/>\u003cforeignObject width=\"171.5625\" height=\"48\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\">\u003cspan class=\"nodeLabel\">\u003cp>收件箱 / SIM / 终端通知\u003cbr />带外通道\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003cdefs>\u003cfilter id=\"personal-learning-learn-backend-authentication-verification-code-registration-login-md-1-drop-shadow\" height=\"130%\" width=\"130%\">\u003cfeDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"/>\u003c/filter>\u003c/defs>\u003cdefs>\u003cfilter id=\"personal-learning-learn-backend-authentication-verification-code-registration-login-md-1-drop-shadow-small\" height=\"150%\" width=\"150%\">\u003cfeDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"/>\u003c/filter>\u003c/defs>\u003c/svg>\u003c/figure>\u003cp>服务端直接控制的通常只有挑战生成、存储、校验和发送请求。邮件路由、运营商网络、用户邮箱安全、SIM 卡控制权、终端通知和恶意软件都在外部边界。验证码成功能够支持的最强结论通常是：\u003cstrong>某个请求者在挑战有效期内获得了发往该目标地址的短期秘密\u003c/strong>。\u003c/p>\n\u003cp>这并不证明：\u003c/p>\n\u003cul>\n\u003cli>请求者是现实世界中的特定自然人；\u003c/li>\n\u003cli>当前控制者长期拥有该邮箱或手机号；\u003c/li>\n\u003cli>设备没有被远程控制；\u003c/li>\n\u003cli>邮箱和短信构成独立于主设备的第二因素；\u003c/li>\n\u003cli>此次认证足以授权任何高风险操作。\u003c/li>\n\u003c/ul>\n\u003cp>认证系统应把这些限制编码进 \u003ccode>authentication_method\u003c/code>、\u003ccode>authentication_time\u003c/code> 和风险策略，而不是只保存一个模糊的 \u003ccode>is_logged_in = true\u003c/code>。\u003c/p>\n\u003ch2>二、请求验证码：创建的是 Challenge，不是验证码字符串\u003c/h2>\n\u003cp>一个稳健的接口不应只有 \u003ccode>target -&gt; code\u003c/code> 映射。服务端应创建有明确用途、生命周期和消费语义的 Challenge：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">POST /auth/challenges\n{\n  &quot;channel&quot;: &quot;email | sms&quot;,\n  &quot;target&quot;: &quot;user@example.com | +8613800000000&quot;,\n  &quot;purpose&quot;: &quot;sign_in&quot;,\n  &quot;client_request_id&quot;: &quot;幂等键&quot;\n}\n\n202 Accepted\n{\n  &quot;challenge_id&quot;: &quot;公开随机标识&quot;,\n  &quot;expires_in&quot;: 300,\n  &quot;resend_after&quot;: 60\n}\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>purpose\u003c/code> 是安全边界，不是分析字段。注册/登录验证码不得被拿去修改手机号、找回账号或确认支付。Challenge 至少需要以下状态：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>字段\u003c/th>\n\u003cth>作用\u003c/th>\n\u003cth>设计要点\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>id\u003c/code>\u003c/td>\n\u003ctd>客户端后续提交的挑战标识\u003c/td>\n\u003ctd>使用不可猜测随机值，不能暴露连续数据库 ID\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>channel\u003c/code> / \u003ccode>purpose\u003c/code>\u003c/td>\n\u003ctd>约束通道和业务用途\u003c/td>\n\u003ctd>校验时必须同时匹配，防止跨用途复用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>target_key\u003c/code>\u003c/td>\n\u003ctd>查找、唯一性和限流\u003c/td>\n\u003ctd>由规范化目标计算受密钥保护的稳定摘要\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>target_ciphertext\u003c/code>\u003c/td>\n\u003ctd>实际发送地址\u003c/td>\n\u003ctd>需要时加密存储并限制读取权限\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>code_mac\u003c/code>\u003c/td>\n\u003ctd>校验短验证码\u003c/td>\n\u003ctd>使用服务端密钥计算 MAC，不存明文\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>expires_at\u003c/code>\u003c/td>\n\u003ctd>截止时间\u003c/td>\n\u003ctd>服务端时间是唯一判断依据\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>attempts\u003c/code> / \u003ccode>max_attempts\u003c/code>\u003c/td>\n\u003ctd>抗在线爆破\u003c/td>\n\u003ctd>失败计数必须跨请求、跨会话保存\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>status\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>pending/consumed/locked/revoked\u003c/code>\u003c/td>\n\u003ctd>状态转换必须原子化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>provider_message_id\u003c/code>\u003c/td>\n\u003ctd>发送追踪\u003c/td>\n\u003ctd>发送成功不等于用户实际收到\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>created_context\u003c/code>\u003c/td>\n\u003ctd>风险与审计\u003c/td>\n\u003ctd>只保存必要且脱敏的 IP、设备与客户端信息\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>短数字验证码的搜索空间很小。仅使用无密钥哈希并不能防止数据库读取者离线枚举全部可能值；一种工程实现是保存 \u003ccode>HMAC(server_secret, challenge_id || purpose || code)\u003c/code>，把离线猜测的成本绑定到服务端秘密。这里的 HMAC 方案是基于短秘密威胁模型的工程推导，并非 RFC 4226 对短信验证码存储格式的直接规定。服务端秘密应由密钥管理系统托管和轮换。\u003c/p>\n\u003ch3>标识规范化先于唯一性判断\u003c/h3>\n\u003cp>邮箱和手机号都不能在业务代码中随手 \u003ccode>lowercase\u003c/code> 或拼接国家码：\u003c/p>\n\u003cul>\n\u003cli>邮箱域名部分不区分大小写；本地部分的比较策略必须由系统明确规定，不能擅自应用 Gmail 去点、去 \u003ccode>+tag\u003c/code> 等提供商专属规则；\u003c/li>\n\u003cli>原始邮箱用于展示和投递，规范化值用于本系统的一致比较；\u003c/li>\n\u003cli>国际化域名需要统一转换和同形字符风险评估；\u003c/li>\n\u003cli>手机号应由成熟号码库结合明确的地区上下文解析为统一格式；仅靠正则无法判断国家码、有效号段或号码归属；\u003c/li>\n\u003cli>数据库唯一约束必须作用于与登录、注册、找回和账号绑定完全相同的规范化策略。\u003c/li>\n\u003c/ul>\n\u003cp>OWASP 特别强调：不一致的邮箱规范化会导致身份混淆和账号接管；应保存原始值，并定义一套贯穿注册、登录、找回和绑定的比较策略。\u003ca href=\"https://cheatsheetseries.owasp.org/cheatsheets/Email_Validation_and_Verification_Cheat_Sheet.html#email-canonicalization\">OWASP：Email Canonicalization\u003c/a>\u003c/p>\n\u003ch3>发送链路应异步，但安全决策必须同步落库\u003c/h3>\n\u003cfigure class=\"diagram\">\u003csvg id=\"personal-learning-learn-backend-authentication-verification-code-registration-login-md-2\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" style=\"max-width: 1508px; background-color: white;\" viewBox=\"-50 -10 1508 741\" role=\"graphics-document document\" aria-roledescription=\"sequence\">\u003cg>\u003crect x=\"1228\" y=\"655\" fill=\"#eaeaea\" stroke=\"#666\" width=\"180\" height=\"65\" name=\"P\" rx=\"3\" ry=\"3\" class=\"actor actor-bottom\"/>\u003ctext x=\"1318\" y=\"687.5\" dominant 防刷不是单个 IP 限流器\u003c/h3>\n\u003cp>RFC 4226 指出短 OTP 天然可被暴力猜测，验证端应保存失败状态并实施节流或锁定，而且限制必须跨登录会话生效。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc4226.html#section-7.3\">RFC 4226：HOTP Validation and Throttling\u003c/a> 对邮件/短信验证码还要限制“发送”本身，否则攻击者可以制造短信费用、骚扰受害者或耗尽供应商额度。\u003c/p>\n\u003cp>生产系统通常同时观察：\u003c/p>\n\u003cul>\n\u003cli>单 IP、IP 网段和网络信誉；\u003c/li>\n\u003cli>单设备或浏览器实例；\u003c/li>\n\u003cli>单目标地址与目标所属账号；\u003c/li>\n\u003cli>单 \u003ccode>purpose\u003c/code> 和接口；\u003c/li>\n\u003cli>同一目标被多少来源请求、同一来源请求多少目标；\u003c/li>\n\u003cli>租户、地区、供应商和系统全局预算。\u003c/li>\n\u003c/ul>\n\u003cp>限流结果不只有允许/拒绝，还可以是延迟、要求额外挑战、降低发送频率或进入人工风控。不要在固定次数后永久锁死账号：攻击者可以借此对已知用户实施拒绝服务。\u003ca href=\"https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html#login-throttling\">OWASP：Authentication Throttling\u003c/a>\u003c/p>\n\u003ch3>响应一致只能降低枚举信号，不能消灭侧信道\u003c/h3>\n\u003cp>无论目标是否已注册，都应返回语义接近的响应，例如“如果该地址可用于登录，我们会发送验证码”。但仅统一文案不够：状态码、响应结构、处理时长、重发倒计时和后续页面都可能暴露账号存在性。OWASP 要求认证和找回流程使用通用响应，并避免明显的处理时差。\u003ca href=\"https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html#authentication-responses\">OWASP：Authentication Responses\u003c/a>\u003c/p>\n\u003cp>“完全恒定时间”在含外部 Provider 的分布式系统中不现实；更可行的目标是统一公开响应路径、异步发送、避免按账号存在性走显著不同的同步工作，并监控批量枚举行为。\u003c/p>\n\u003ch2>三、校验验证码：成功必须是一次原子消费\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">POST /auth/challenges/{challenge_id}/verify\n{\n  &quot;code&quot;: &quot;123456&quot;\n}\n\u003c/code>\u003c/pre>\n\u003cp>服务端不能只执行 \u003ccode>code == stored_code\u003c/code>。校验条件至少包括：\u003c/p>\n\u003cul>\n\u003cli>Challenge 存在且属于预期 \u003ccode>purpose\u003c/code>；\u003c/li>\n\u003cli>\u003ccode>status == pending\u003c/code>；\u003c/li>\n\u003cli>当前时间未超过 \u003ccode>expires_at\u003c/code>；\u003c/li>\n\u003cli>\u003ccode>attempts &lt; max_attempts\u003c/code>；\u003c/li>\n\u003cli>目标和当前业务上下文没有被替换；\u003c/li>\n\u003cli>\u003ccode>code_mac\u003c/code> 匹配；\u003c/li>\n\u003cli>成功消费与后续认证授权不可被并发重复执行。\u003c/li>\n\u003c/ul>\n\u003cp>Challenge 的核心状态机如下：\u003c/p lay: table-cell; white-space: nowrap; line-height: 1.5; max-width: 10px; text-align: center;\">\u003cspan class=\"nodeLabel\">\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"label edgeLabel\" id=\"Pending---Pending---2\" transform=\"translate(159.97265625, 331)\">\u003crect width=\"0.1\" height=\"0.1\"/>\u003cg class=\"label\" style=\"\" transform=\"translate(0, 0)\">\u003crect/>\u003cforeignObject width=\"0\" height=\"0\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 10px; text-align: center;\">\u003cspan class=\"nodeLabel\">\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003cdefs>\u003cfilter id=\"personal-learning-learn-backend-authentication-verification-code-registration-login-md-3-drop-shadow\" height=\"130%\" width=\"130%\">\u003cfeDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"/>\u003c/filter>\u003c/defs>\u003cdefs>\u003cfilter id=\"personal-learning-learn-backend-authentication-verification-code-registration-login-md-3-drop-shadow-small\" height=\"150%\" width=\"150%\">\u003cfeDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"/>\u003c/filter>\u003c/defs>\u003c/svg>\u003c/figure>\u003cp>关键不是代码比较，而是 \u003ccode>Pending -&gt; Consumed\u003c/code> 只能成功一次。可以通过带条件的数据库更新、行锁事务或支持 compare-and-set 的存储完成：\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">UPDATE auth_challenge\nSET status = &#39;consumed&#39;, consumed_at = CURRENT_TIMESTAMP\nWHERE id = :id\n  AND purpose = &#39;sign_in&#39;\n  AND status = &#39;pending&#39;\n  AND expires_at &gt; CURRENT_TIMESTAMP\n  AND attempts &lt; max_attempts\n  AND code_mac = :submitted_code_mac;\n\u003c/code>\u003c/pre>\n\u003cp>只有影响行数为 1，调用方才获得一次性验证结果。失败计数也需要原子增加；实际实现可能先在事务中锁定记录，再验证 MAC 并更新状态，避免“比较成功”和“标记消费”之间出现竞态。\u003c/p>\n\u003ch3>重发验证码有两种合理策略\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>新码使旧码立即失效\u003c/strong>：安全模型简单，但短信/邮件乱序可能导致用户输入刚收到的旧码却失败；\u003c/li>\n\u003cli>\u003cstrong>短时间允许多个独立 Challenge\u003c/strong>：用户体验更好，但扩大了有效猜测窗口和状态复杂度。\u003c/li>\n\u003c/ol>\n\u003cp>不论采用哪种策略，客户端必须提交 \u003ccode>challenge_id\u003c/code>，服务端必须限制同一目标的活动 Challenge 数量。不要只按手机号查找“最后一个验证码”，这会让并发请求、消息乱序和重放难以定义。\u003c/p>\n\u003ch3>Challenge 消费后不要直接信任客户端字段\u003c/h3>\n\u003cp>校验成功后，服务端应产生内部的“已验证声明”，包含规范化目标、通道、用途、认证时间和 Challenge ID。它可以在同一数据库事务内直接进入用户决策；如果认证与用户服务跨越不同存储，则可签发极短期、单次使用的 verification grant，并在下游再次原子消费。客户端提交的 \u003ccode>email\u003c/code>、\u003ccode>phone\u003c/code> 或 \u003ccode>user_id\u003c/code> 不能覆盖这个服务端声明。\u003c/p>\n\u003ch2>四、注册和登录应该共享一条身份决策链\u003c/h2>\n\u003cp>验证码校验完成后才判断这是注册还是登录，可以避免在请求阶段暴露账号是否存在：\u003c/p>\n\u003cfigure class=\"diagram\">\u003csvg id=\"personal-learning-learn-backend-authentication-verification-code-registration-login-md-4\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" class=\"flowchart\" style=\"max-width: 671.5px; background-color: white;\" viewBox=\"0 0 671.5 1526\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\">\u003cstyle>#personal-learning-learn-backend-authentication-verification-code-registration-login-md-4{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#personal-learning-learn-backend-authentication-verification-code-registration-login-md-4 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#personal-learning-learn-backend-authentication-verification-code-registration-login-md-4 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#personal-learning-learn-backend-authentication-verification-code-registration-login-md-4 .error-icon{fill:#552222;}#personal-learning-lear width=\"144\" height=\"24\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\">\u003cspan class=\"nodeLabel\">\u003cp>唯一约束是否冲突？\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"node default\" id=\"personal-learning-learn-backend-authentication-verification-code-registration-login-md-4-flowchart-NewUser-15\" data-look=\"classic\" transform=\"translate(299.5, 1247)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-54\" y=\"-27\" width=\"108\" height=\"54\"/>\u003cg class=\"label\" style=\"\" transform=\"translate(-24, -12)\">\u003crect/>\u003cforeignObject width=\"48\" height=\"24\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\">\u003cspan class=\"nodeLabel\">\u003cp>新用户\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"node default\" id=\"personal-learning-learn-backend-authentication-verification-code-registration-login-md-4-flowchart-Gate-19\" data-look=\"classic\" transform=\"translate(299.5, 1375)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-130\" y=\"-39\" width=\"260\" height=\"78\"/>\u003cg class=\"label\" style=\"\" transform=\"translate(-100, -24)\">\u003crect/>\u003cforeignObject width=\"200\" height=\"48\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;\">\u003cspan class=\"nodeLabel\">\u003cp>状态、租户、风险与封禁检查\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"node default\" id=\"personal-learning-learn-backend-authentication-verification-code-registration-login-md-4-flowchart-Session-25\" data-look=\"classic\" transform=\"translate(299.5, 1491)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-94\" y=\"-27\" width=\"188\" height=\"54\"/>\u003cg class=\"label\" style=\"\" transform=\"translate(-64, -12)\">\u003crect/>\u003cforeignObject width=\"128\" height=\"24\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\">\u003cspan class=\"nodeLabel\">\u003cp>创建全新登录会话\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003cdefs>\u003cfilter id=\"personal-learning-learn-backend-authentication-verification-code-registration-login-md-4-drop-shadow\" height=\"130%\" width=\"130%\">\u003cfeDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"/>\u003c/filter>\u003c/defs>\u003cdefs>\u003cfilter id=\"personal-learning-learn-backend-authentication-verification-code-registration-login-md-4-drop-shadow-small\" height=\"150%\" width=\"150%\">\u003cfeDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"/>\u003c/filter>\u003c/defs>\u003c/svg>\u003c/figure>\u003ch3>两种产品语义\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>自动注册并登录\u003c/strong>：一个验证码入口同时服务新老用户。转换路径短，但用户可能在不清楚的情况下创建账号，还要处理预占账号、条款同意和必填资料；\u003c/li>\n\u003cli>\u003cstrong>先验证再完成注册\u003c/strong>：验证码通过后得到短期注册授权，补充条款、用户名或组织信息后才创建用户。状态更多，但账号创建语义清晰。\u003c/li>\n\u003c/ul>\n\u003cp>两种方案的底层身份约束相同：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>identity(channel, normalized_target)\u003c/code> 必须有数据库唯一约束；\u003c/li>\n\u003cli>创建用户与绑定标识应在同一事务，或采用可恢复的工作流；\u003c/li>\n\u003cli>并发注册发生唯一键冲突时，重新查询既有身份，而不是返回第二个用户；\u003c/li>\n\u003cli>API 的幂等键用于重试，不能代替数据库唯一约束；\u003c/li>\n\u003cli>已绑定联系方式的变更是高风险操作，不能复用普通登录验证码流程。\u003c/li>\n\u003c/ul>\n\u003ch3>手机号不是永久主键\u003c/h3>\n\u003cp>手机号会被运营商回收。长期系统不能把“手机号字符串”当作不可变的人：应保存独立 \u003ccode>user_id\u003c/code>，手机号只是可绑定、可撤销的认证标识。长期未登录、号码变更、运营商风险或敏感操作可以触发额外验证。邮箱也可能更名、被回收或受组织管理员控制，同样不应成为业务表之间的永久外键。\u003c/p>\n\u003ch2>五、登录态如何建立：浏览器优先采用不透明 Session Cookie\u003c/h2>\n\u003cp>验证码通过后的 "119\" x2=\"412\" y2=\"119\" class=\"messageLine0\" data-et=\"message\" data-id=\"i0\" data-from=\"C\" data-to=\"A\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#personal-learning-learn-backend-authentication-verification-code-registration-login-md-5-arrowhead)\" style=\"fill: none;\"/>\u003ctext x=\"417\" y=\"134\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-size: 16px; font-weight: 400;\">原子消费 Challenge\u003c/text>\u003cpath d=\"M 417,173 C 477,163 477,203 417,193\" class=\"messageLine0\" data-et=\"message\" data-id=\"i1\" data-from=\"A\" data-to=\"A\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#personal-learning-learn-backend-authentication-verification-code-registration-login-md-5-arrowhead)\" style=\"fill: none;\"/>\u003ctext x=\"538\" y=\"218\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-size: 16px; font-weight: 400;\">查询或创建用户\u003c/text>\u003cline x1=\"417\" y1=\"257\" x2=\"658\" y2=\"257\" class=\"messageLine0\" data-et=\"message\" data-id=\"i2\" data-from=\"A\" data-to=\"U\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#personal-learning-learn-backend-authentication-verification-code-registration-login-md-5-arrowhead)\" style=\"fill: none;\"/>\u003ctext x=\"541\" y=\"272\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-size: 16px; font-weight: 400;\">user_id + account state\u003c/text>\u003cline x1=\"661\" y1=\"311\" x2=\"420\" y2=\"311\" class=\"messageLine1\" data-et=\"message\" data-id=\"i3\" data-from=\"U\" data-to=\"A\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#personal-learning-learn-backend-authentication-verification-code-registration-login-md-5-arrowhead)\" style=\"stroke-dasharray: 3, 3; fill: none;\"/>\u003ctext x=\"638\" y=\"326\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-size: 16px; font-weight: 400;\">创建全新 Session\u003c/text>\u003cline x1=\"417\" y1=\"365\" x2=\"858\" y2=\"365\" class=\"messageLine0\" data-et=\"message\" data-id=\"i4\" data-from=\"A\" data-to=\"S\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#personal-learning-learn-backend-authentication-verification-code-registration-login-md-5-arrowhead)\" style=\"fill: none;\"/>\u003ctext x=\"641\" y=\"380\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-size: 16px; font-weight: 400;\">random session_id\u003c/text>\u003cline x1=\"861\" y1=\"419\" x2=\"420\" y2=\"419\" class=\"messageLine1\" data-et=\"message\" data-id=\"i5\" data-from=\"S\" data-to=\"A\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#personal-learning-learn-backend-authentication-verification-code-registration-login-md-5-arrowhead)\" style=\"stroke-dasharray: 3, 3; fill: none;\"/>\u003ctext x=\"247\" y=\"434\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-size: 16px; font-weight: 400;\">设置安全的 HttpOnly Session Cookie\u003c/text>\u003cline x1=\"415\" y1=\"473\" x2=\"79\" y2=\"473\" class=\"messageLine1\" data-et=\"message\" data-id=\"i6\" data-from=\"A\" data-to=\"C\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#personal-learning-learn-backend-authentication-verification-code-registration-login-md-5-arrowhead)\" style=\"stroke-dasharray: 3, 3; fill: none;\"/>\u003ctext x=\"618\" y=\"488\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-size: 16px; font-weight: 400;\">Cookie: __Host-session=...\u003c/text>\u003cline x1=\"76\" y1=\"527\" x2=\"1159\" y2=\"527\" class=\"messageLine0\" data-et=\"message\" data-id=\"i7\" data-from=\"C\" data-to=\"B\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#personal-learning-learn-backend-authentication-verification-code-registration-login-md-5-arrowhead)\" style=\"fill: none;\"/>\u003ctext x=\"1014\" y=\"542\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-size: 16px; font-weight: 400;\">hash(session_id) 查会话\u003c/text>\u003cline x1=\"1162\" y1=\"581\" x2=\"866\" y2=\"581\" class=\"messageLine0\" data-et=\"message\" data-id=\"i8\" data-from=\"B\" data-to=\"S\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#personal-learning-learn-backend-authentication-verification-code-registration-login-md-5-arrowhead)\" style=\"fill: none;\"/>\u003ctext x=\"1011\" y=\"596\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-size: 16px; font-weight: 400;\">user_id + expiry + auth context\u003c/text>\u003cline x1=\"863\" y1=\"635\" x2=\"1159\" y2=\"635\" class=\"messageLine1\" data-et=\"message\" data-id=\"i9\" data-from=\"S\" data-to=\"B\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#personal-learning-learn-backend-authentication-verification-code-registration-login-md-5-arrowhead)\" style=\"stroke-dasharray: 3, 3; fill: none;\"/>\u003ctext x=\"621\" y=\"650\" text-anchor=\"middle\" dominant-baseline=\"middle\" alignment-baseline=\"middle\" class=\"messageText\" dy=\"1em\" style=\"font-size: 16px; font-weight: 400;\">已授权响应\u003c/text>\u003cline x1=\"1162\" y1=\"689\" x2=\"79\" y2=\"689\" class=\"messageLine1\" data-et=\"message\" data-id=\"i10\" data-from=\"B\" data-to=\"C\" stroke-width=\"2\" stroke=\"none\" marker-end=\"url(#personal-learning-learn-backend-authentication-verification-code-registration-login-md-5-arrowhead)\" style=\"stroke-dasharray: 3, 3; fill: none;\"/>\u003c/svg>\u003c/figure>\u003cp>这里 Cookie 只保存一个高熵、不透明、无业务含义的随机 Session ID；用户身份、权限、认证方式、过期和撤销状态保存在服务端。RFC 10025 定义了 Cookie 的当前状态管理语义及 \u003ccode>Secure\u003c/code>、\u003ccode>HttpOnly\u003c/code>、\u003ccode>SameSite\u003c/code> 和 Cookie name prefix 等机制。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc10025.html\">IETF RFC 10025：Cookies\u003c/a>\u003c/p>\n\u003cp>推荐的会话记录至少包含：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">session_id_hash\nuser_id\ncreated_at\nlast_seen_at\nidle_expires_at\nabsolute_expires_at\nauthentication_time\nauthentication_method = email_otp | sms_otp | passkey | ...\nauth_strength / risk_state\ndevice_label（可选、用户可见）\nrevoked_at / revoke_reason\n\u003c/code>\u003c/pre>\n\u003cp>浏览器拿到原始 Session ID，服务端存其单向摘要，数据库泄露时减少直接重放风险。Session ID 必须由密码学安全随机数生成器产生；不要使用用户 ID、时间戳或可解码业务字段。\u003c/p>\n\u003ch3>Cookie 属性解决不同问题\u003c/h3>\n\u003cpre>\u003ccode class=\"language-http\">Set-Cookie: __Host-session=&lt;opaque-random-id&gt;; Path=/; Secure; HttpOnly; SameSite=Lax\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003ccode>Secure\u003c/code>：只在安全连接中发送；\u003c/li>\n\u003cli>\u003ccode>HttpOnly\u003c/code>：阻止前端脚本通过 \u003ccode>document.cookie\u003c/code> 读取，但不能阻止 XSS 以用户身份发起请求；\u003c/li>\n\u003cli>\u003ccode>SameSite\u003c/code>：限制跨站请求携带 Cookie，是 CSRF 的纵深防御；\u003c/li>\n\u003cli>\u003ccode>Path=/\u003c/code> 且不设置 \u003ccode>Domain\u003c/code>：配合 \u003ccode>__Host-\u003c/code> 前缀，将 Cookie 收窄到当前主机；\u003c/li>\n\u003cli>\u003ccode>Max-Age/Expires\u003c/code>：决定浏览器是否跨重启保留 Cookie，不替代服务端过期检查。\u003c/li>\n\u003c/ul>\n\u003cp>\u003ccode>SameSite=Lax\u003c/code> 通常兼顾从外部链接进入后的登录体验和部分 CSRF 防护；高风险或封闭系统可以评估 \u003ccode>Strict\u003c/code>。跨站前端必须使用 \u003ccode>SameSite=None; Secure\u003c/code> 时，CSRF Token、Origin/Referer 校验和严格 CORS 更重要。OWASP 明确指出 SameSite 通常只是纵深防御，不能在一般部署中替代正规的 CSRF 防护。\u003ca href=\"https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html#samesite-cookie-attribute\">OWASP：CSRF Prevention\u003c/a>\u003c/p>\n\u003ch3>登录成功必须创建或轮换 Session ID\u003c/h3>\n\u003cp>如果匿名访问阶段已经有 Session，验证码认证后不能继续沿用原 ID。攻击者可能预先把自己知道的 Session ID 植入受害者浏览器，等待受害者完成登录，这就是 Session Fixation。认证成功或权限等级改变时应创建新 Session ID，并废弃旧 ID。\u003ca href=\"https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html#renew-the-session-id-after-any-privilege-level-change\">OWASP：Renew the Session ID After Privilege Change\u003c/a>\u003c/p>\n\u003ch2>六、Session、Access Token 与 Refresh Token 不是同一层的替代品\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方案\u003c/th>\n\u003cth>客户端持有什么\u003c/th>\n\u003cth>服务端主要状态\u003c/th>\n\u003cth>优势\u003c/th>\n\u003cth>主要代价\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>服务端 Session\u003c/td>\n\u003ctd>不透明 Session ID Cookie\u003c/td>\n\u003ctd>完整会话记录\u003c/td>\n\u003ctd>撤销和风险控制直接，适合同源 Web/BFF\u003c/td>\n\u003ctd>需要共享 Session Store 与容量治理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>短期 Access Token\u003c/td>\n\u003ctd>有限期 Bearer Token\u003c/td>\n\u003ctd>密钥、授权与撤销相关状态\u003c/td>\n\u003ctd>API 边界清晰，适合多资源服务\u003c/td>\n\u003ctd>泄露后在有效期内可重放，权限收回不即时\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Access + Refresh Token\u003c/td>\n\u003ctd>短期访问凭证 + 长期续期凭证\u003c/td>\n\u003ctd>Refresh Token 家族与轮换状态\u003c/td>\n\u003ctd>适合移动端、授权服务器和多客户端\u003c/td>\n\u003ctd>轮换、重放检测、吊销与安全存储复杂\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>自包含 JWT 登录态\u003c/td>\n\u003ctd>包含 claims 的签名 Token\u003c/td>\n\u003ctd>密钥与必要撤销状态\u003c/td>\n\u003ctd>资源端可本地校验\u003c/td>\n\u003ctd>不是天然无状态；失效、权限变化和密钥轮换更难\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>对同源浏览器应用，服务端 Session + \u003ccode>HttpOnly\u003c/code> Cookie 通常是更简单的默认值：浏览器不需要让 JavaScript 持有长期 Bearer Token，服务端可以立即撤销。BFF 可以在服务端替浏览器持有下游 Access Token，对浏览器仍只暴露 Session Cookie。\u003c/p>\n\u003cp>当系统确实采用 OAuth Refresh Token 时，RFC 9700 要求公共客户端通过发送者约束或 Refresh Token 轮换来检测重放；新 Token 签发后旧 Token 失效，旧 Token 再次出现意味着同一 Token 家族可能已泄露。\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9700.html#section-4.14\">IETF RFC 9700：Refresh Token Protection\u003c/a>\u003c/p>\n\u003cp>“JWT 无需数据库”是危险的简化：生产系统仍要处理账号冻结、权限变更、设备退出、Token 撤销、密钥轮换和重放。是否本地验证 claims 是部署决策，不等于不存在登录态生命周期。\u003c/p>\n\u003ch2>七、登录态是可撤销的租约，不是永久布尔值\u003c/h2>\n\ 07797439 -1.6069690242163557 C2.0081268553382308 -1.496117172916782, 2.09271010209987 -1.3753197776503712, 2.1650635094610915 -1.2500000000000089 C2.237416916822313 -1.1246802223496466, 2.299738906453196 -0.9910302842862939, 2.3492315519647673 -0.855050358314182 C2.3987241974763385 -0.71907043234207, 2.4368913078579792 -0.5766288372196986, 2.462019382530518 -0.4341204441673369 C2.487147457203057 -0.29161205111497523, 2.4936698970884197 -0.07235340736123454, 2.5 -1.1714553645825241e-14 C2.5063301029115803 0.07235340736121111, 2.50633010291158 -0.07235340736122292, 2.5 0\" stroke=\"#9370DB\" stroke-width=\"2\" fill=\"none\" stroke-dasharray=\"0 0\" style=\"\"/>\u003c/g>\u003c/g>\u003c/g>\u003cg class=\"label edgeLabel\" id=\"Active---Active---1\" transform=\"translate(1057.2421875, 234)\">\u003crect width=\"0.1\" height=\"0.1\"/>\u003cg class=\"label\" style=\"\" transform=\"translate(0, 0)\">\u003crect/>\u003cforeignObject width=\"0\" height=\"0\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 10px; text-align: center;\">\u003cspan class=\"nodeLabel\">\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"label edgeLabel\" id=\"Active---Active---2\" transform=\"translate(1113.70703125, 352)\">\u003crect width=\"0.1\" height=\"0.1\"/>\u003cg class=\"label\" style=\"\" transform=\"translate(0, 0)\">\u003crect/>\u003cforeignObject width=\"0\" height=\"0\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 10px; text-align: center;\">\u003cspan class=\"nodeLabel\">\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003cdefs>\u003cfilter id=\"personal-learning-learn-backend-authentication-verification-code-registration-login-md-6-drop-shadow\" height=\"130%\" width=\"130%\">\u003cfeDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"/>\u003c/filter>\u003c/defs>\u003cdefs>\u003cfilter id=\"personal-learning-learn-backend-authentication-verification-code-registration-login-md-6-drop-shadow-small\" height=\"150%\" width=\"150%\">\u003cfeDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"/>\u003c/filter>\u003c/defs>\u003c/svg>\u003c/figure>\u003cp>三个超时解决不同问题：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>空闲超时\u003c/strong>限制无人使用但仍存活的会话；\u003c/li>\n\u003cli>\u003cstrong>绝对超时\u003c/strong>限制会话无论是否活跃的最长寿命；\u003c/li>\n\u003cli>\u003cstrong>轮换周期\u003c/strong>减少同一 Session ID 长期暴露，但轮换必须处理并发请求和短暂宽限。\u003c/li>\n\u003c/ul>\n\u003cp>所有过期判断必须由服务端执行。客户端倒计时只改善体验，不能决定授权。OWASP 建议应用同时实现空闲和绝对超时，并提供明确退出；高风险事件后需要重新认证和 Session 轮换。\u003ca href=\"https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html#session-expiration\">OWASP：Session Expiration\u003c/a>\u003c/p>\n\u003cp>需要撤销会话的典型事件包括：\u003c/p>\n\u003cul>\n\u003cli>用户主动退出或选择“退出其他设备”；\u003c/li>\n\u003cli>主邮箱、手机号、密码或强认证器发生变化；\u003c/li>\n\u003cli>账号冻结、删除、租户移除或高风险权限变更；\u003c/li>\n\u003cli>Refresh Token 重放、Session 异常使用或凭证泄露；\u003c/li>\n\u003cli>管理员或风控系统明确撤销。\u003c/li>\n\u003c/ul>\n\u003cp>“修改手机号后旧登录态是否全部失效”不是技术常量，而是风险政策。但系统必须具备按 Session、用户、设备或 Token 家族撤销的能力，才能实施任何政策。\u003c/p>\n\u003ch2>八、攻击面贯穿申请、发送、校验和会话\u003c/h2>\n\u003cfigure class=\"diagram\">\u003csvg id=\"personal-learning-learn-backend-authentication-verification-code-registration-login-md-7\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" class=\"flowchart\" style=\"max-width: 1372.31px; background-color: white;\" viewBox=\"0 0 1372.3125 482\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\">\u003cstyle>#personal-learning-learn-backend-authentication-verification-code-registration-login-md-7{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dasho 003ctd>多维速率与预算、异常检测、必要时额外挑战\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>邮箱接管 / SIM Swap\u003c/td>\n\u003ctd>攻击者控制带外通道\u003c/td>\n\u003ctd>认证强度分级、风险再认证、强认证器\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>号码回收\u003c/td>\n\u003ctd>新号码持有人进入旧账号\u003c/td>\n\u003ctd>独立用户 ID、长期未用风险、额外恢复策略\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>预占账号\u003c/td>\n\u003ctd>攻击者先用受害者标识创建不完整账号\u003c/td>\n\u003ctd>验证后创建/激活、绑定唯一约束、账号合并政策\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Session Fixation\u003c/td>\n\u003ctd>登录后沿用攻击者已知 Session\u003c/td>\n\u003ctd>认证和提权后轮换 Session ID\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CSRF\u003c/td>\n\u003ctd>浏览器自动附带 Cookie 执行跨站请求\u003c/td>\n\u003ctd>SameSite、CSRF Token、Origin 检查、无副作用 GET\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>XSS\u003c/td>\n\u003ctd>恶意脚本以当前用户权限操作\u003c/td>\n\u003ctd>输出编码、CSP、依赖治理；HttpOnly 只降低直接窃取\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>日志泄露\u003c/td>\n\u003ctd>验证码、Token、PII 写入日志\u003c/td>\n\u003ctd>结构化脱敏、字段拒绝列表、最小访问权限\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>验证码认证不应成为修改认证标识或恢复账号的循环依赖：如果用户只凭发往“新手机号”的验证码就能替换旧手机号，那么任何能申请绑定的人都可能接管账号。敏感变更需要验证当前会话、旧认证器或另一个独立恢复通道，并向旧联系方式发送通知。\u003c/p>\n\u003ch2>九、推荐的生产边界：把认证做成可审计状态机\u003c/h2>\n\u003cp>下面是本文基于前述规范重建的参考架构，不代表某个官方产品的模块划分：\u003c/p>\n\u003cfigure class=\"diagram\">\u003csvg id=\"personal-learning-learn-backend-authentication-verification-code-registration-login-md-8\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" class=\"flowchart\" style=\"max-width: 1355.11px; background-color: white;\" viewBox=\"0 0 1355.11328125 632\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\">\u003cstyle>#personal-learning-learn-backend-authentication-verification-code-registration-login-md-8{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#personal-learning-learn-backend-authentication-verification-code-reg lns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\">\u003cspan class=\"nodeLabel\">\u003cp>Challenge Store\u003cbr />短期状态、原子消费\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"node default\" id=\"personal-learning-learn-backend-authentication-verification-code-registration-login-md-8-flowchart-User-5\" data-look=\"classic\" transform=\"translate(401.1015625, 432)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-104.1015625\" y=\"-39\" width=\"208.203125\" height=\"78\"/>\u003cg class=\"label\" style=\"\" transform=\"translate(-74.1015625, -24)\">\u003crect/>\u003cforeignObject width=\"148.203125\" height=\"48\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\">\u003cspan class=\"nodeLabel\">\u003cp>User + Identity Store\u003cbr />用户与唯一绑定\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"node default\" id=\"personal-learning-learn-backend-authentication-verification-code-registration-login-md-8-flowchart-Session-6\" data-look=\"classic\" transform=\"translate(649.203125, 432)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-94\" y=\"-39\" width=\"188\" height=\"78\"/>\u003cg class=\"label\" style=\"\" transform=\"translate(-64, -24)\">\u003crect/>\u003cforeignObject width=\"128\" height=\"48\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\">\u003cspan class=\"nodeLabel\">\u003cp>Session Store\u003cbr />过期、轮换、撤销\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"node default\" id=\"personal-learning-learn-backend-authentication-verification-code-registration-login-md-8-flowchart-Queue-7\" data-look=\"classic\" transform=\"translate(1242.92578125, 432)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-84.3828125\" y=\"-27\" width=\"168.765625\" height=\"54\"/>\u003cg class=\"label\" style=\"\" transform=\"translate(-54.3828125, -12)\">\u003crect/>\u003cforeignObject width=\"108.765625\" height=\"24\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\">\u003cspan class=\"nodeLabel\">\u003cp>Message Queue\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"node default\" id=\"personal-learning-learn-backend-authentication-verification-code-registration-login-md-8-flowchart-Provider-8\" data-look=\"classic\" transform=\"translate(1242.92578125, 585)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-104.1875\" y=\"-27\" width=\"208.375\" height=\"54\"/>\u003cg class=\"label\" style=\"\" transform=\"translate(-74.1875, -12)\">\u003crect/>\u003cforeignObject width=\"148.375\" height=\"24\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\">\u003cspan class=\"nodeLabel\">\u003cp>Email / SMS Provider\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003cg class=\"node default\" id=\"personal-learning-learn-backend-authentication-verification-code-registration-login-md-8-flowchart-Audit-9\" data-look=\"classic\" transform=\"translate(936.62890625, 585)\">\u003crect class=\"basic label-container\" style=\"\" x=\"-75.296875\" y=\"-39\" width=\"150.59375\" height=\"78\"/>\u003cg class=\"label\" style=\"\" transform=\"translate(-45.296875, -24)\">\u003crect/>\u003cforeignObject width=\"90.59375\" height=\"48\">\u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\">\u003cspan class=\"nodeLabel\">\u003cp>Audit / Alert\u003cbr />脱敏事件\u003c/p>\u003c/span>\u003c/div>\u003c/foreignObject>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003c/g>\u003cdefs>\u003cfilter id=\"personal-learning-learn-backend-authentication-verification-code-registration-login-md-8-drop-shadow\" height=\"130%\" width=\"130%\">\u003cfeDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"/>\u003c/filter>\u003c/defs>\u003cdefs>\u003cfilter id=\"personal-learning-learn-backend-authentication-verification-code-registration-login-md-8-drop-shadow-small\" height=\"150%\" width=\"150%\">\u003cfeDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"/>\u003c/filter>\u003c/defs>\u003c/svg>\u003c/figure>\u003ch3>数据所有权\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Challenge Store\u003c/strong>只负责短期挑战及其原子状态，不是用户数据库；\u003c/li>\n\u003cli>\u003cstrong>User/Identity Store\u003c/strong>保存稳定 \u003ccode>user_id\u003c/code> 与可变认证标识的绑定；\u003c/li>\n\u003cli>\u003cstrong>Session Store\u003c/strong>保存持续授权，不能依赖验证码记录判断后续登录；\u003c/li>\n\u003cli>\u003cstrong>Risk Service\u003c/strong>给出风险信号和速率决策，不直接篡改身份事实；\u003c/li>\n\u003cli>\u003cstrong>Queue/Provider\u003c/strong>负责投递，不拥有“验证成功”这一安全状态；\u003c/li>\n\u003cli>\u003cstrong>Audit\u003c/strong>记录谁在何时进行了哪类状态转换，但不记录验证码、Token 或完整 PII。\u003c/li>\n\u003c/ul>\n\u003ch3>故障语义\u003c/h3>\n\u003cul>\n\u003cli>Provider 超时：Challenge 仍可保持 \u003ccode>pending\u003c/code> 或标记发送失败，但不能假装已送达；\u003c/li>\n\u003cli>消息重复：发送任务用 Challenge ID 幂等，重复发送不能创建新的安全状态；\u003c/li>\n\u003cli>Auth 服务重试：创建 Challenge、创建用户和创建 Session 分别使用明确幂等键；\u003c/li>\n\u003cli>Session Store 不可用：宁可暂时拒绝授权，也不能绕过会话检查；\u003c/li>\n\u003cli>风控服务不可用：根据业务风险选择 fail-closed、降级额度或只允许低风险路径，并记录降级事件；\u003c/li>\n\u003cli>跨区域复制延迟：不能让已消费 Challenge 在另一地区再次成功，安全关键写入需要单主、强一致或可证明的全局原子方案。\u003c/li>\n\u003c/ul>\n\u003ch2>十、实现检查清单\u003c/h2>\n\u003ch3>Challenge\u003c/h3>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 邮箱和手机号使用统一且有文档的规范化策略。\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Challenge 绑定 \u003ccode>channel + target + purpose\u003c/code>。\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 验证码不以明文或可离线枚举的无密钥哈希存储。\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 有效期、尝试次数和发送次数均由服务端限制。\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 成功校验是原子、单次消费。\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 重发、乱序和并发请求的语义明确。\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 请求响应不会轻易暴露账号是否存在。\u003c/li>\n\u003c/ul>\n\u003ch3>身份与注册\u003c/h3>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 用户使用独立不可变 \u003ccode>user_id\u003c/code>，邮箱/手机号只是绑定标识。\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 规范化标识有数据库唯一约束。\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 用户创建与身份绑定具备事务或可恢复工作流。\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 自动注册、补资料和条款同意的产品语义明确。\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 修改标识、账号恢复和普通登录使用不同用途与更强策略。\u003c/li>\n\u003c/ul>\n\u003ch3>登录态\u003c/h3>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 登录和提权后创建或轮换 Session ID。\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Session ID 高熵、无业务含义，服务端保存其摘要。\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Cookie 至少考虑 \u003ccode>Secure\u003c/code>、\u003ccode>HttpOnly\u003c/code>、\u003ccode>SameSite\u003c/code>、\u003ccode>Path\u003c/code> 和 \u003ccode>__Host-\u003c/code>。\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Cookie 登录配套 CSRF 防护，不能只依赖 SameSite。\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 服务端执行空闲、绝对和撤销检查。\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 用户可以查看并终止其他设备会话。\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 风险事件可触发重新认证或批量撤销。\u003c/li>\n\u003c/ul>\n\u003ch3>运营与验证\u003c/h3>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 限流覆盖 IP、设备、目标、账号、用途和全局预算。\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 验证码、Token、完整验证链接和完整 PII 不进入日志。\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 发送、验证、注册、会话创建与撤销都有脱敏审计事件。\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Provider 故障、队列重复和跨区域竞态经过演练。\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> 高风险操作不只依赖邮箱或短信验证码。\u003c/li>\n\u003c/ul>\n\u003ch2>来源审计与适用边界\u003c/h2>\n\u003cp>本文主要使用 NIST 数字身份指南、IETF RFC 和 OWASP Cheat Sheet：\u003c/p>\n\u003cul>\n\u003cli>NIST 用于判断邮箱和 PSTN 带外认证的安全强度及认证器生命周期；\u003c/li>\n\u003cli>RFC 4226 用于短 OTP 的在线猜测、失败状态与节流原则；\u003c/li>\n\u003cli>RFC 10025 用于 Cookie、SameSite 与 Cookie prefix 的当前协议语义；\u003c/li>\n\u003cli>RFC 9700 用于 Refresh Token 轮换与重放检测；\u003c/li>\n\u003cli>OWASP 用于邮箱规范化、统一认证响应、Session 生命周期与 CSRF 工程控制。\u003c/li>\n\u003c/ul>\n\u003cp>核心流程和状态机是对这些来源的工程归纳，并非某一规范规定的唯一数据库模型。验证码长度、有效期、重试次数、Session 超时和限流阈值必须根据业务风险、用户群体、供应商延迟和攻击数据确定，本文不提供脱离环境的“安全常数”。本文未实现可运行 Demo，因此 SQL 原子更新、跨服务 verification grant 和跨区域一致性仅完成静态设计审查，没有完成并发或故障注入验证。\u003c/p>\n\u003cp>主要来源：\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"https://pages.nist.gov/800-63-4/sp800-63b.html\">NIST SP 800-63B：Authentication and Authenticator Management\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://www.rfc-editor.org/rfc/rfc4226.html\">IETF RFC 4226：HOTP\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://www.rfc-editor.org/rfc/rfc10025.html\">IETF RFC 10025：Cookies\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9700.html\">IETF RFC 9700：OAuth 2.0 Security Best Current Practice\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html\">OWASP：Authentication Cheat Sheet\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html\">OWASP：Session Management Cheat Sheet\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://cheatsheetseries.owasp.org/cheatsheets/Email_Validation_and_Verification_Cheat_Sheet.html\">OWASP：Email Validation and Verification Cheat Sheet\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html\">OWASP：Cross-Site Request Forgery Prevention Cheat Sheet\u003c/a>\u003c/li>\n\u003c/ul>\n"}},"firstDocumentId":"vuex-pinia"};
